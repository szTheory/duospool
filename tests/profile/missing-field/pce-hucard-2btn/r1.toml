# First-profile record, revision 1 (PROF-01, D-27, D-28). Frozen once a decision record or phase references it; a change is a new rN.toml.
# owner-selected: scope fields the owner chose (record 0002, D-06). open: a field with a labelled research proposal and NO value.
# An open field never becomes a default; phases 2-5 bind it explicitly in the run request. This file enforces structure, not truth.
profile_id = "pce-hucard-2btn"
rev = 1
unresolved_behaviours = ["LED-IRQ-0001", "LED-VID-0002", "LED-VID-0003"]

[media_slot]
status = "owner-selected"
value = "hucard"
allowed = ["hucard"]
decision = "docs/decisions/0002-first-profile.md"
label = "Content media slot: HuCard only; no CD-ROM media in this profile."

[expansion_port]
status = "owner-selected"
value = "absent"
allowed = ["absent"]
decision = "docs/decisions/0002-first-profile.md"
label = "Expansion port: modelled as absent; no CD-ROM unit attached."

[vdc_count]
status = "owner-selected"
value = 1
decision = "docs/decisions/0002-first-profile.md"
label = "Number of video display controllers: one; no SuperGrafx second VDC."

[chip_revision]
status = "owner-selected"
value = "huc6280"
allowed = ["huc6280"]
ledger = ["LED-PROF-0001"]
decision = "docs/decisions/0002-first-profile.md"
label = "CPU and PSG revision (one die): HuC6280. A scope choice only; it makes no claim about which retail models shipped which revision."

[input_port1]
status = "owner-selected"
value = "pad2"
decision = "docs/decisions/0002-first-profile.md"
label = "Controller on port 1: two-button pad; no multitap."

[io_1000_d6_value]
status = "open"
proposal = "1"
allowed = ["0", "1"]
ledger = ["LED-IO-0001"]
label = "Proposal only: value read on bit 6 of a $1000 read. Named by observed behaviour; its meaning is not established."

[io_1000_d7_value]
status = "open"
proposal = "1"
allowed = ["0", "1"]
ledger = ["LED-IO-0001"]
label = "Proposal only: value read on bit 7 of a $1000 read (CD sense; 1 modelled as no CD). Its meaning is not established."

[lines_per_frame]
status = "open"
proposal = "262"
allowed = ["262", "263"]
ledger = ["LED-VID-0001"]
label = "Line count per frame; if the count is guest-selectable through a VCE bit, this field means the power-on value, not a hardware constant. Proposal only."

[psg_tick_divisor]
status = "open"
proposal = "6"
allowed = ["3", "6"]
ledger = ["LED-AUD-0001"]
label = "Proposal only: master clock divisor for the PSG tick. Not established; a placeholder until a measurement exists."

[content_byte_order]
status = "open"
proposal = "pce"
allowed = ["pce", "tg16"]
ledger = ["LED-LOAD-0001"]
label = "Proposal only: HuCard byte order declared by the caller and never detected."

[content_copier_header]
status = "open"
proposal = "refuse"
allowed = ["refuse", "declared-512"]
ledger = ["LED-LOAD-0002"]
label = "Proposal only: handling of a 512-byte copier header; refuse means a header-prefixed image is refused, not stripped or detected."

[powerup_policy]
status = "open"
proposal = "seeded-prng-v1"
label = "Proposal only: power-on memory and register policy. Phase 2 defines it; no ledger entry yet."
