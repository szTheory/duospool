# The no-input script of the two-button pad fixture fixtures/src/pad_2btn.s (plan 03-29; D-117, D-118, ER-5): an explicit empty script, so nothing is ever held and a run with it is a no-input run that differs from a run with no script key at all by its identity in the record.
# It is a negative control of the correct script (pad_2btn_correct.toml): the same ROM must give a different verdict. It is read only by scripts/conformance-flatten --inputs. A test input declared by a case, E2 self-consistency, not a claim about any pad.
[script]
format = 1
time_unit = "master_clock"
events = 0
