# The correct-input script of the two-button pad fixture fixtures/src/pad_2btn.s (plan 03-27; D-115, D-116, D-117, ER-5). It is read only by scripts/conformance-flatten --inputs (the one parser of hand-edited data, D-51) and reaches the runner as flattened rows.
# format 1; the time unit is the master clock of machine time (OSC1); an event sets the ABSOLUTE level of its port from time at on, and the guest sees it only through its own reads of the $1000 window. Ports are numbered from 1; the profile populates port 1 only.
# held lists button names once each in the canonical bit order of the CD BIOS mask (CDBIOS-p28): i ii select run up right down left; a pressed button reads 0 on the wire. This is a test input declared by the case, E2 self-consistency, not a claim about any pad.
[script]
format = 1
time_unit = "master_clock"
events = 4

[ev_0001]
at = 0
port = 1
held = ["run"]

[ev_0002]
at = 140000
port = 1
held = ["i", "right"]

[ev_0003]
at = 320000
port = 1
held = ["ii", "up", "left"]

[ev_0004]
at = 510000
port = 1
held = ["select", "right", "down"]
