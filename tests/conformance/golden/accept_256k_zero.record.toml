#
# E0 repeatability record (D-53): a 256 KiB synthetic image booted under the zero power-on policy, no seed.
# It shows that the same inputs print the same bytes. It does not show that the machine behaviour is right. Machine time counts placeholder
# cycles and the power-on values are modelling assumptions (LED-PROF-0002); the profile, content and digest hashes were recomputed with the host
# sha tool over streams rebuilt without the C code. The digest line was recomputed for serial version 2 (regions PROF CONT POWR TIME RAM8 MPRS
# CPU0, plan 03-03) with a throwaway perl script that wrote the stream of the documented rules, checked with shasum -a 256 over the stream
# file. The runner skips this comment block and compares the rest byte for byte.
[record]
format_version = 1

[core]
build_id = "unset"
behaviour_epoch = 1

[profile]
id = "pce-hucard-2btn"
rev = 1
sha256 = "da2b433d08c7494048d6744976de2c5b0f5c2de269ef38bb6018eecc223a1bf0"

[field_media_slot]
status = "owner-selected"
value = "hucard"
bound_by = "constant"

[field_expansion_port]
status = "owner-selected"
value = "absent"
bound_by = "constant"

[field_vdc_count]
status = "owner-selected"
value = "1"
bound_by = "constant"

[field_vpc]
status = "owner-selected"
value = "false"
bound_by = "constant"

[field_chip_revision]
status = "owner-selected"
value = "huc6280"
bound_by = "constant"

[field_input_port1]
status = "owner-selected"
value = "pad2"
bound_by = "constant"

[field_io_1000_d6_value]
status = "open"
value = "1"
bound_by = "run-request"

[field_io_1000_d7_value]
status = "open"
value = "1"
bound_by = "run-request"

[field_lines_per_frame]
status = "open"
value = "262"
bound_by = "run-request"

[field_psg_tick_divisor]
status = "open"
value = "6"
bound_by = "run-request"

[field_content_byte_order]
status = "open"
value = "pce"
bound_by = "run-request"

[field_content_copier_header]
status = "open"
value = "refuse"
bound_by = "run-request"

[field_powerup_policy]
status = "open"
value = "zero"
bound_by = "run-request"

[withheld]
ids = ["LED-AUD-0001", "LED-IO-0001", "LED-IRQ-0001", "LED-LOAD-0001", "LED-LOAD-0002", "LED-LOAD-0003", "LED-LOAD-0005", "LED-PROF-0002", "LED-VID-0001", "LED-VID-0002", "LED-VID-0003"]

[content]
sha256 = "cb038cda079ab0edec440521c4dc250a8a8c2af6e068470dbda7f05ff07b0287"
size = 262144
mapper = "plain"
mapper_rule = "plain-v1"
byte_order = "pce"
header_handling = "none"

[power_on]
policy = "zero"
policy_version = 1
seed_present = false
seed = 0

[limits]
size_cap = 1048576

[machine]
time = 0
time_unit = "placeholder-cycles"
digest_algorithm = "sha256"
digest = "31de49ddccdc45c5b59de53301fb9d1a0e049768dfd663a3612669cfd7b05964"
