# E0 repeatability record (D-53): a 384 KiB synthetic image booted under the seeded-prng-v1 power-on policy with seed 42.
# It shows that the same inputs print the same bytes. It does not show that the machine behaviour is right. Machine time counts master clocks
# and the power-on values are modelling assumptions (LED-PROF-0002); the profile, content and digest hashes were recomputed with the host
# sha tool over streams rebuilt without the C code. The digest line was recomputed for serial version 2 (regions PROF CONT POWR TIME RAM8 MPRS
# CPU0, plan 03-03) with a throwaway perl script that wrote the stream of the documented rules, checked with shasum -a 256 over the stream
# file. Plan 03-36 changed only three values, format_version 1 to 2, behaviour_epoch 1 to 2 and the time unit from the placeholder label to master-clocks;
# the digest line was unchanged by that plan (the epoch is not in the digest stream). Plan 03-16 added the region BUS0 (io_buffer and mpr_latch, two zero bytes at boot) and the serial version 3, so the digest line changed again:
# it was recomputed with a throwaway perl script that wrote the version 3 stream of the documented rules, after the same script had reproduced the committed version 2 digest from the version 2 stream, and the stream file hashes
# to the value under shasum -a 256. Plan 03-17 added the third BUS0 byte (the selection index of the model parameter tma_zero, 0 at boot) and the serial version 4, so the digest line changed again:
# it was recomputed with the same throwaway perl script after it had reproduced the committed version 3 digest, and the stream file hashes to the value under shasum -a 256. The runner skips this comment block and compares the rest byte for byte.
# Plan 03-18 changed the layout, format_version 2 to 3: after [power_on] the record now holds [model_tma_zero] (the default, bound_by default), [constants] (the nine rows of src/core/constants.def, each NAME = "VALUE LEDGER") and [run] (reason none for a boot that ran nothing),
# and [withheld] gained the ledger ids of the model row and of the constants rows. The literals were written by hand from the two def files, never copied from printer output. The digest line did not change (no state was added), and the profile and content hashes did not change.
# Plan 03-22 added the second row of src/core/model_params.def, irq_i_sample (default pre, ledger LED-IRQ-0005, status open): the record gains the table [model_irq_i_sample] after [model_tma_zero] and [withheld] the id LED-IRQ-0005 (18 ids, under the cap of 24). The two blocks were written by hand from the def and are not printer output; the layout otherwise did not change.
# Plan 03-22 also added the regions TIMR, IRQC and IRQS and the serial version 5, so the digest line changed: it was recomputed with a throwaway python script outside the repo that rebuilt the version 4 stream of this boot (and checked it against the committed version 4 digest 1843d592... under
# shasum -a 256), set the version to 5 and appended the frames TIMR (11 zero bytes), IRQC (3) and IRQS (160); the 8588-byte stream file hashes to the new value under shasum -a 256. The profile and content hashes did not change.
# Plan 03-23 changed the layout, format_version 3 to 4: the table [stimulus] (events = 0 for a boot that declares none, then one event_N line per declared event as AT,LINE,LEVEL in decimal) follows the model tables, and the table [constants] gained the four rows timer_hold_on_stop, irq_sample_cycles_before_end,
# interrupt_entry_cycles and speed_switch_extra_cycles of src/core/constants.def, whose ledger ids LED-IRQ-0003, LED-IRQ-0006, LED-CPU-0009 and LED-CPU-0006 joined [withheld] (22 ids, under the cap of 24). The literals were written by hand from the def, not copied from printer output. The digest line, the profile hash and the content hash did not change (no state was added).
# Plan 03-25 added the region BLKT (the block transfer in progress: active, opcode, alternation state, remaining count as a u32, source and destination as u16, 11 zero bytes at boot) and the serial version 6, so the digest line changed: it was recomputed with a throwaway python script outside
# the repo that took the 8588-byte version 5 stream of this boot from the core's stream writer, checked that its sha256 equals the committed version 5 digest above, set the version to 6 and appended the frame BLKT with 11 zero bytes; the 8607-byte stream hashes to the new value under shasum -a 256.
# The same plan added the constants rows block_prologue_cycles and block_irq_after_epilogue of src/core/constants.def, whose ledger ids LED-CPU-0008 and LED-IRQ-0007 joined [withheld] (24 ids, the cap of the record printer: any further id needs a layout change). The literals were written by hand from the def, not copied from printer output.
# Plan 03-28 changed the layout, format_version 4 to 5: the table [input] (events = 0 for a boot that is given no input script, then schedule_sha256, the sha256 of the canonical encoding of the declared schedule: one line AT,PORT,MASK in decimal and one LF per event) follows [stimulus]. A no-input boot is an explicit empty script, so the identity is the sha256 of zero bytes,
# e3b0c442..., checked with shasum -a 256 over an empty file and not taken from printer output; the block was written by hand from the layout, and no ledger id joined [withheld] (24 of 24 is unchanged). The digest line, the profile hash and the content hash did not change (the schedule is not in the digest before plan 03-29).
# Plan 03-29 (D-116, D-117, D-121; INP-04) added the regions IOPT (the latch of port O and the device kind of each of the five ports, 6 bytes: FF 01 00 00 00 00 at boot) and SCHD (the declared input schedule: 1024 slots of 16 bytes and the count and a reserved word, 16392 zero bytes for a boot that is given no input) and the serial version
# 7, so the digest line changed. A throwaway C program outside the repo booted this request and wrote the 8607-byte version 6 stream with the core's stream writer, which hashes to the committed version 6 digest above under shasum -a 256; a throwaway python script outside the repo set the version to 7 and appended the frames IOPT and SCHD
# written from the rules above, and the 25021-byte stream it wrote hashes to the new digest under shasum -a 256. No other line of the record changed (the schedule is not in the printed record, which names it in [input]).
# Plan 03-29 changed the layout, format_version 5 to 6 (D-53 amended; the standing note on the 24-id cap of the single ids line): the table [withheld] is now count = N and one row id_1 to id_N per ledger id in sorted order, written here from the defs and the ledger (the ids of the open fields the default request binds, the unresolved
# behaviours of the profile, LED-LOAD-0003, LED-LOAD-0005 and LED-PROF-0002, and the ledger id of every row of src/core/model_params.def and src/core/constants.def), not copied from printer output. The same plan added the constants rows pad_clr_high_nibble (0, LED-IO-0003), io_poweron_latch (255, LED-IO-0003) and pad_settle_mclk (0, LED-
# IO-0004) after block_irq_after_epilogue, so LED-IO-0003 and LED-IO-0004 joined [withheld] (26 ids). The digest line is the one of the version 7 stream above: the constants and the layout are not in the digest.
# Code review fix WR-01 (erratum R-9 of 03-CONTEXT.md) changed the sample after BRK, so behaviour_epoch went from 2 to 3 and nothing else in this record changed: the digest, the profile hash, the content hash and every table are as before (the epoch is not in the digest stream). The literal 3 was written by hand.
# Code review fix WR-02 (the pc field of the device-register records of a block transfer) moved behaviour_epoch from 3 to 4 and again nothing else in this record changed; the literal 4 was written by hand.
# Plan 04-03 (the one Phase 4 bump; D-165, D-167, D-168) changed the layout, format_version 6 to 7, and the epoch, behaviour_epoch 4 to 5 (literals written by hand): the table [model_vd_irq_phase] (line_start, LED-IRQ-0001) and
# [model_rcr_origin] (first_active, LED-IRQ-0010) follow [model_irq_i_sample], [constants] gained line_mclk (1365, LED-VID-0001) and rcr_counter_poweron (16384, LED-IRQ-0010), and [withheld] gained LED-IRQ-0010 (27 ids; LED-IRQ-0001
# and LED-VID-0001 were present). These blocks were written by hand from the def files, never copied from printer output. The serial version went 7 to 8 with the seven regions VCE0, PALT, VDC0, BEAM, VDMA, VRAM and SATB appended, so
# the digest line changed: the 25021-byte version 7 stream of this boot was dumped by a scratch copy of the version 7 tree and its shasum -a 256 equalled the committed version 7 digest above (45cb85ee...) before anything else was
# done; a throwaway python script outside the repo, which never called the new core, set the version to 8 and appended the seven frames (VCE0 3, PALT 1024, VDC0 45, BEAM 33, VDMA 25, VRAM 65536, SATB 512 bytes, zero except BEAM:
# rcr_counter 16384, frame_lines 262 and display_k 0xFFFF at their stream offsets, F-11); the 92255-byte stream it wrote hashes to the new digest under shasum -a 256. The profile and content hashes did not change. Evidence tier E0.
# Plan 04-04 (the tracer; D-136, D-141, D-152, D-153) added eight rows to src/core/constants.def, written here by hand from the def: raster_phase_mclk and line_sample_offset_mclk (0, LED-VID-0004), vce_div_cr0 and vce_div_cr1 (4 and 3, LED-VID-0017), vce_div_cr2 and vce_div_cr3 (2 and 2, LED-VID-0002),
# vce_unused_read and vce_data_hi_unused_or (255 and 254, LED-VID-0016), so [constants] has 28 rows and [withheld] gained LED-VID-0004, LED-VID-0016 and LED-VID-0017 (30 ids in sorted order; LED-VID-0002 was present). Not copied from printer output. The format version, the epoch, the digest and the profile and content hashes did not change. Evidence tier E0.
# Plan 04-06 (the VDC interface; D-144, D-147) added three rows to src/core/constants.def, written here by hand from the def: vdc_vram_words and vdc_oob_read (32768 and 0, LED-VID-0007) and vdc_bsy_level (0, LED-VID-0015),
# so [constants] has 31 rows and [withheld] gained LED-VID-0007 and LED-VID-0015 (32 ids in sorted order). Not copied from printer output. The format version, the epoch, the digest and the profile and content hashes did not change. Evidence tier E0.
# Plan 04-10 (VRAM-to-VRAM and VRAM-to-SATB DMA; D-150, D-151) added one row to src/core/constants.def, written here by hand from the def: vdc_dma_dots_per_word (4, LED-VID-0014), so [constants] has 32 rows and [withheld] gained LED-VID-0014 (33 ids in sorted order). Not copied from printer output.
# The format version, the epoch, the digest and the profile and content hashes did not change. Evidence tier E0.
# Plan 04-11 (the background renderer; D-157) added one row to src/core/constants.def, written here by hand from the def: bg_off_index (0, LED-VID-0010), so [constants] has 33 rows and [withheld] gained LED-VID-0010 (34 ids in sorted order). Not copied from printer output.
# The format version, the epoch, the digest and the profile and content hashes did not change. Evidence tier E0.
