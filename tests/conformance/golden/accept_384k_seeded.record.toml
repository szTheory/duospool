# E0 repeatability record (D-53): a 384 KiB synthetic image booted under the seeded-prng-v1 power-on policy with seed 42.
# It shows that the same inputs print the same bytes. It does not show that the machine behaviour is right. Machine time counts master clocks
# and the power-on values are modelling assumptions (LED-PROF-0002); the profile, content and digest hashes were recomputed with the host
# sha tool over streams rebuilt without the C code. The digest line was recomputed for serial version 2 (regions PROF CONT POWR TIME RAM8 MPRS
# CPU0, plan 03-03) with a throwaway perl script that wrote the stream of the documented rules, checked with shasum -a 256 over the stream
# file. Plan 03-36 changed only three values, format_version 1 to 2, behaviour_epoch 1 to 2 and the time unit from the placeholder label to master-clocks;
# the digest line was unchanged by that plan (the epoch is not in the digest stream). Plan 03-16 added the region BUS0 (io_buffer and mpr_latch, two zero bytes at boot) and the serial version 3, so the digest line changed again:
# it was recomputed with a throwaway perl script that wrote the version 3 stream of the documented rules, after the same script had reproduced the committed version 2 digest from the version 2 stream, and the stream file hashes
# to the value under shasum -a 256. Plan 03-17 added the third BUS0 byte (the selection index of the model parameter tma_zero, 0 at boot) and the serial version 4, so the digest line changed again:
# it was recomputed with the same throwaway perl script after it had reproduced the committed version 3 digest, and the stream file hashes to the value under shasum -a 256. The runner skips this comment block and compares the rest byte for byte.
# Plan 03-18 changed the layout, format_version 2 to 3: after [power_on] the record now holds [model_tma_zero] (the default, bound_by default), [constants] (the nine rows of src/core/constants.def, each NAME = "VALUE LEDGER") and [run] (reason none for a boot that ran nothing),
# and [withheld] gained the ledger ids of the model row and of the constants rows. The literals were written by hand from the two def files, never copied from printer output. The digest line did not change (no state was added), and the profile and content hashes did not change.
[record]
format_version = 3

[core]
build_id = "unset"
behaviour_epoch = 2

[profile]
id = "pce-hucard-2btn"
rev = 1
sha256 = "aa7e8b3468c136ee2c145095ff221fb49ed1303b0e9c8815baae5fb62a83ae41"

