#
# E0 repeatability record (D-53): a 384 KiB synthetic image booted under the seeded-prng-v1 power-on policy with seed 42.
# It shows that the same inputs print the same bytes. It does not show that the machine behaviour is right. Machine time counts master clocks and the power-on values are modelling assumptions (LED-PROF-0002).
# The runner skips this comment block and compares the rest byte for byte. History of the block before plan 05-03 is in git (plans 03-03 to 04.1-01); this block keeps the method and the derivation of every literal in the file now.
# Derivation of the literals. The profile and content hashes were recomputed with the host sha tool (shasum -a 256) over the profile and content streams rebuilt without the C code; they have not changed since plan 03-03.
# schedule_sha256 is the sha256 of zero bytes (a no-input boot is an explicit empty script, plan 03-28), checked with shasum -a 256 over an empty file and not taken from printer output.
# format_version, behaviour_epoch, the time unit, the field and model tables, [stimulus], [input], [run], [limits], every [constants] row (NAME = "VALUE LEDGER", in the order of src/core/constants.def) and every [withheld] id (count = N, then id_1 to id_N in sorted
# order: the open fields the default request binds, the unresolved profile behaviours, LED-LOAD-0003, LED-LOAD-0005, LED-PROF-0002 and the ledger id of every row of src/core/model_params.def and src/core/constants.def) were written by hand from the def files and
# the ledger, never copied from printer output. The epoch and the constants are not in the digest stream.
# The digest line (current regeneration method, the P15 method of plan 04-03, used for every serial bump): a scratch copy of the OLD tree dumps the OLD digest stream of this boot, and its shasum -a 256 must equal the committed OLD digest before anything
# else is done; a throwaway script outside the repository, which never calls the new core, sets the new serial version and appends the new frames written by hand from the documented layout; shasum -a 256 of the stream it wrote is the new digest.
# The digest now in the file is the serial version 9 stream (24 regions, 92553 bytes; plan 05-03, D-202): the version 8 stream of this boot (92255 bytes, the 21 regions PROF .. SATB) was dumped by a scratch copy of the version 8 tree and its shasum -a 256
# equalled the committed version 8 digest (5ecef2a4...) first; the script set the version to 9 and appended PSG0 (42 zero bytes), PSGW (192 zero bytes: the seeded-prng-v1 policy draws no wave) and PSGT (24 zero bytes for the six frozen channel counters,
# then 01 00 00 00 four times: both noise distances 1 and both LFSRs psg_lfsr_reset 1 at machine time 0). The version 8 frames were derived in plan 04-03 the same way from version 7 (VCE0 3, PALT 1024, VDC0 45, BEAM 33, VDMA 25, VRAM 65536, SATB 512 bytes,
# zero except BEAM: rcr_counter 16384, frame_lines 262 and display_k 0xFFFF, F-11).
# Plan 05-03 also moved format_version 7 to 8 and behaviour_epoch 5 to 6, added the 15 psg_ rows of src/core/constants.def to [constants] (49 rows) and LED-AUD-0004, -0007, -0008, -0009 (the volume table, PR-8), -0010, -0012 and -0014 to [withheld]
# (42 ids), all written by hand from the defs; epoch 6 is unreleased (D-202, R11).
# Evidence tier E0 throughout.
