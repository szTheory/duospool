# The memory map and the mapping registers seen from the guest (plan 03-16; D-102, D-103, D-104, D-124, D-125, D-127): the authored fixture fixtures/src/mmu_mpr.s is assembled by ca65 in the gate (never committed),
# boots on the core, runs to the absolute deadline until_mclk (master clocks) and writes a DSV1 verdict block that the runner judges from raw RAM. The 256 KiB image carries its own tag bytes in the banks above bank 0, so a
# bank, an offset and a mirror each show in a read, and from check 22 on the windows of the hardware page and the bus latch io_buffer are checked. The expected literals are in the literal table of fixtures/lib/check.inc and classed in fixtures/src/mmu_mpr.checks: a manual page (MAN), an in-guest computation (GUEST)
# or an assumed ledger entry (ASSUMED); none comes from DuoSpool output. The case has no policies key, so the guest kind runs the ROM under its default policy list (D-127). The toy control unmapped-value
# (tests/controls/unmapped-value) must turn this case guest_failure. Evidence tier E0, a mechanism check against the project's own assumptions: no accuracy or compatibility claim, and the word pass is not a support claim.
# Checks 49, 59 and 60 are observe-only rows (plan 03-17): TMA with the operand $00 is the model parameter tma_zero, so this case (the default, bus_latch) expects the latch bytes, observe=49:248 ($F8), 59:249 ($F9) and 60:249; mmu_mpr_tma_zero_keep expects the unchanged A (90, 17, 34).
# Checks 61 to 65 are the power-up observe rows (plan 03-24; D-114, D-127): the guest reads MPR0 and MPR3 to MPR6 before it writes any mapping register and stores the bytes without comparing them,
# so this case marks each observe=IDX:policy (recorded, compared with no value, exempt from the cross-policy equality that the default three-policy list of the guest kind applies).
# mmu_mpr_policy_diff is the control that requires check 62 to differ between zero and the v2 seeds.
id = "mmu_mpr_256k"
kind = "guest"
fixture = "authored:mmu-mpr"
request = ""
expect = "id=8;observe=49:248;observe=59:249;observe=60:249;observe=61:policy;observe=62:policy;observe=63:policy;observe=64:policy;observe=65:policy"
meaning = "The authored mmu_mpr fixture maps banks through MPR3 and MPR4 and leaves a consistent DSV1 block of 65 passing checks: unmapped banks read $FF, work RAM is mirrored, HuCard banks show their tag bytes, ROM writes are ignored, the VDC window reads its status ($00 at reset) and its data MSB, an empty window reads $FF, the VCE window reads back a colour table entry (MAN H6-5)"
required = true
control = false
expect_outcome = "pass"
pins = ["LED-CPU-0012"]
until_mclk = 4000000
checks = 65
