# Mutation sweep of the cyc_probe fixture (plan 03-15; D-126, ER-7, FIX-03, plan-check item B4): the built image of fixtures/src/cyc_probe.s is loaded once, its DCK1 literal table is found at file offset $1000, and for each of the 12
# checks the value byte of its entry is XORed with $FF in a fresh in-memory copy that is booted and run in this same process. The unmutated image must pass first. Each mutation must flip exactly its own check to $46 and leave the
# others $50: a check whose literal can be changed without flipping it is vacuous and the case is guest_failure. The GUEST check patches an XOR mask, so a patched mask turns the comparison red. cyc_probe has no observe row, so there is
# nothing to exclude. The sweep covers the completion checks only: the cycle counts of the probe are judged by the runner kind cycle_probe from the trace (case cycle_adders_manual), and a literal of that case is not part of the image.
# The sweep runs under the default power-on policy only. Evidence tier E0 (a mechanism check of the checks themselves): no accuracy or compatibility claim.
id = "mutate_sweep_cyc_probe"
kind = "mutate_sweep"
fixture = "authored:cyc-probe"
request = ""
expect = "id=7"
meaning = "Changing the expected literal of any one of the 12 cyc_probe completion checks flips exactly that check to fail and no other, so none of the 12 checks is vacuous"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 4000000
checks = 12
