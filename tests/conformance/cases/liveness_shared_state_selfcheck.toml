#
# Liveness of the interleave helper (CORE-01, D-55): the helper that interleave_ab uses is run twice. With separate instances it reports no
# difference. With the memory of B aliased to the memory of A (the second pointer equal to the first, so that B's boot overwrites A and every call
# reaches the same machine) it must report a difference. A helper that cannot see sharing would pass every interleave case for any core.
# Evidence tier E0, a witness about the test and not about hardware.
id = "liveness_shared_state_selfcheck"
kind = "liveness_shared_state_selfcheck"
fixture = "plain-256k"
request = "bind.powerup_policy=seeded-prng-v1;seed=1||bind.powerup_policy=seeded-prng-v1;seed=2;len=393216"
expect = "lcg=20241110;steps=64"
meaning = "The interleave comparison reports a difference when two instances share one block of memory and none when they are separate, so a pass of the interleave cases is not a blind comparison"
required = true
control = false
expect_outcome = "pass"
pins = []
