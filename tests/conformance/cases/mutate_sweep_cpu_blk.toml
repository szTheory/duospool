# Mutation sweep of the cpu-blk image of fixtures/src/cpu_blk.s (plan 03-25; D-126, ER-7, FIX-03, W10): the built image is loaded once, its DCK1 literal table is found at file offset $1000, and for each of the 50 checks the value byte of its entry is XORed with $FF in a fresh in-memory
# copy that is booted and run in this same process. The unmutated image must pass first. Each mutation must flip exactly its own check to $46 and leave the others $50: a check whose literal can be changed without flipping it is vacuous and the case is guest_failure. The GUEST checks patch an XOR mask, so a patched
# mask turns the comparison red. No check of cpu_blk is an observe row, so there is nothing to exclude. The sweep runs under the default power-on policy only (the policy comparison is the guest kind's job). Evidence tier E0 (a mechanism check of the checks themselves): no accuracy or compatibility claim.
id = "mutate_sweep_cpu_blk"
kind = "mutate_sweep"
fixture = "authored:cpu-blk"
request = ""
expect = "id=13"
meaning = "Changing the expected literal of any one of the 50 checks of the cpu-blk image flips exactly that check to fail and no other, so none of the 50 checks is vacuous"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 1150000
checks = 50
