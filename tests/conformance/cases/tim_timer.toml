# The timer and the timer interrupt seen from the guest (plan 03-21; D-109, D-110, D-111, D-124, D-125, D-127, ER-3, ER-4): the authored fixture fixtures/src/tim_timer.s is assembled by ca65 in the gate (never committed), boots on the core, runs to the absolute deadline until_mclk (master clocks)
# and writes a DSV1 verdict block that the runner judges from raw RAM. The tracer rows start the timer at reload 0 with I clear and D set, take the TIQ interrupt through the TIMER vector, and check what the handler saw (I set, D clear, the request register with TIQ set and then cleared by a write) and what the
# entry pushed. The expected literals are in the literal table of fixtures/lib/check.inc and classed in fixtures/src/tim_timer.checks: a manual page (MAN) or a cell the guest wrote itself (GUEST); none comes from DuoSpool output. The case has no policies key, so the guest kind runs the ROM under its default policy list (D-127).
# Evidence tier E0 for the mechanism, and E2 self-consistency for every row that reads the counter after a counted number of instructions (those depend on the community-reported CPU cycle length, ER-3): no accuracy, timer-accuracy or CPU-speed claim, and the word pass is not a support claim.
id = "tim_timer"
kind = "guest"
fixture = "authored:tim-timer"
request = ""
expect = "id=10"
meaning = "The authored tim_timer fixture starts the timer at reload 0, takes the TIQ interrupt through the TIMER vector, reads the request register in the handler, stops the timer, acknowledges with a write to the request register and returns with RTI, and leaves a consistent DSV1 block of ten passing checks"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 4000000
checks = 10
