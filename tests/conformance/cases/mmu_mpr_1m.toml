# The memory map and the mapping registers seen from the guest, 1 MiB image (plan 03-20; D-102, D-103, D-104, D-124, D-125, D-127): the authored fixture fixtures/src/mmu_mpr.s is assembled once more by ca65 with ROMBANKS=128 (scripts/fixture-build, the
# variants list), is booted on the core, runs to the absolute deadline until_mclk (master clocks) and writes a DSV1 verdict block that the runner judges from raw RAM. It is the same source and the same 65 checks as mmu_mpr_256k; only the literals of checks 18 and 19
# differ, by conditional assembly on ROMBANKS, because the mirror rule of the plain mapper differs by image size (ASSUMED:LED-LOAD-0003): check 18 reads bank $20 (file bank $20, tag $20, a mirror of bank 0 in the 256 KiB image) and check 19 bank $7F (file bank $7F, tag $7F, the last bank of the window), because a 1 MiB image has no mirror of its window.
# The expected literals are the table of fixtures/lib/check.inc and classed in fixtures/src/mmu_mpr.checks (a manual page, an in-guest computation or an assumed ledger entry); none comes from DuoSpool output. Checks 49, 59 and 60 are observe-only rows (plan 03-17):
# TMA with the operand $00 is the model parameter tma_zero, so this case (the default, bus_latch) expects the latch bytes, observe=49:248 ($F8), 59:249 ($F9) and 60:249, exactly as mmu_mpr_256k does, because the two images share the TMA #0 observe rows. The case has
# no policies key, so the guest kind runs the ROM under its default policy list (D-127). Evidence tier E0, a mechanism check against the project's own assumptions: no accuracy or compatibility claim, and the word pass is not a support claim.
# Checks 61 to 65 are the power-up observe rows (plan 03-24; D-114, D-127): the guest reads MPR0 and MPR3 to MPR6 before it writes any mapping register and stores the bytes without comparing them,
# so this case marks each observe=IDX:policy (recorded, compared with no value, exempt from the cross-policy equality that the default three-policy list of the guest kind applies).
# mmu_mpr_policy_diff is the control that requires check 62 to differ between zero and the v2 seeds.
id = "mmu_mpr_1m"
kind = "guest"
fixture = "authored:mmu-mpr-1m"
request = ""
expect = "id=8;observe=49:248;observe=59:249;observe=60:249;observe=61:policy;observe=62:policy;observe=63:policy;observe=64:policy;observe=65:policy"
meaning = "The 1 MiB variant of the authored mmu_mpr fixture leaves a consistent DSV1 block of 65 passing checks; the bank-tag checks 18 and 19 show that a 1 MiB image has no mirror of its window: bank $20 and bank $7F are their own file banks"
required = true
control = false
expect_outcome = "pass"
pins = ["LED-CPU-0013"]
until_mclk = 4000000
checks = 65
