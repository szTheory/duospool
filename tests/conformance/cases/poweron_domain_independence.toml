#
# Domain independence (D-50, D-75): each power-on domain has its own stream, so how many values another stream draws cannot change a byte of
# ram8k (interleaved with 1 and then 1000 extra draws of the stream of a value that names no domain, constant 0; the two placeholder-register
# domains left in plan 03-36 and the v2 domains arrive in plan 03-24), that stream's first 16 bytes differ from the ram8k
# bytes, the stream does not start at the bare seed XOR constant, and a boot with the seed lays down the ram8k stream. Checked against streams the kind builds
# with the public stream functions; the byte values themselves are pinned by poweron_draw_order with perl-derived literals. Evidence tier E0, a
# modelling assumption and not a hardware claim (LED-PROF-0002).
id = "poweron_domain_independence"
kind = "poweron_domain"
fixture = "none"
request = "seed=42"
expect = "extra=1,1000"
meaning = "For seed 42 the ram8k bytes are unchanged when another stream draws 1 or 1000 extra values, the two streams' bytes differ, and a boot reproduces the ram8k stream"
required = true
control = false
expect_outcome = "pass"
pins = []
