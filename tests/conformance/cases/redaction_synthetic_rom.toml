# Redaction row (D-47, D-56): a synthetic ROM is generated at run time with markers derived from the marker seed of this run and embedded at four offsets. It is booted and its record printed. None of the markers may appear, as bytes or hex, in anything the runner printed, the record or the evidence text. Evidence tier E0 (repeatability and a literal), claims nothing about hardware.
id = "redaction_synthetic_rom"
