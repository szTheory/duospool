# The authored fixture fixtures/src/vdc_irq.s built with -D LINES=263 (the 263-line variant, F-38) is assembled by ca65 in the gate (never committed). It measures time with a spin counter (inc a, bra: 6 CPU cycles, 18 master clocks per iteration, tests/oracle/huc6280-opcodes.tsv H8-25) and an IRQ1 handler chain that programs RCR for the next event from a table, samples
# the counter before it reads the status, and logs sample and status in work RAM; no absolute line or frame number is asserted (D-136).
# Binding-independent guest checks (16 in all): the iterations from RCR = 100 to 108 against 8 times those from 100 to 101 (GUEST: no constant is assumed, within the derived 12 iterations), the iterations in 100 lines and in 4 frames against 100 * 1365 / 18 and 4 * frame_lines * 1365 / 18 (ASSUMED LED-VID-0001: the 1365-clock line, the frame length of the bound profile;
# ER-3: the 3-clock cycle, LED-CPU-0009 entry cycles, LED-CPU-0017 window penalty inside the handler cost K),
# the flag order (RR alone in the handler of the last display line RCR, VD alone in the next, 1 to 151 iterations later: MAN H7-4; the two-line bound ASSUMED LED-VID-0001), every status byte of four cycles, bits 6 and 7 zero (ASSUMED LED-VID-0015), the level that re-enters a handler that does not acknowledge (ASSUMED LED-IRQ-0009), and the cycle counter. Rows 13 to 16
# are the raw measurements (observe rows, F-41); they are judged by vdc_irq_agree, so the items below mark them policy (exempt from the equality across power-on policies here, where vdc_irq_agree compares the whole block).
# The case has no policies key, so the guest kind runs the ROM under its default policy list and the result bytes of the checks must be equal in all three: every register is 0 at power-on and every cell the checks read is written first (D-167). Evidence tier E0: no accuracy, compatibility, raster or hardware claim; the word pass is not a support claim. The toys vid-rcr-
# base and status-read-keeps-flags (plan 04-17) turn this case red.
