#
# Memory overlap row (WR-02): the request struct lies inside the instance block.
# ds_boot zeroes the instance before it reads the request and the content, so an overlap would boot from zeroed or garbled bytes and report a content id for them.
# The request is the ordinary plain one and the expect key names the overlap (content, request, result or edge). The core refuses an overlap as load.memory_invalid after every other check has passed (no row of boot_order.def changes) and leaves the block untouched.
# Evidence tier E0 (repeatability and a literal), claims nothing about hardware.
id = "ref_mem_overlap_request"
kind = "mem_overlap"
fixture = "plain-256k"
request = "mapper=plain;order=pce;header=none"
expect = "request"
meaning = "A fully declared request whose request struct lies inside the instance block is refused as load.memory_invalid and the block stays byte-identical, instead of reading a zeroed request"
required = true
control = false
expect_outcome = "pass"
pins = []
