# The assumption-free group of the vdc_irq fixture, judged alone (plan 04-17; D-173, F-4, F-43): the same authored ROM as the case vdc_irq, but only checks 1 and 2 have to pass (judge=1-2): the iterations from RCR = 100 to RCR = 108 equal 8 times those from RCR = 100 to RCR = 101 within 12 iterations, in two cycles. No constant is assumed (class GUEST: the increment of
