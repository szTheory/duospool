# Restore at the stops of a video run (plan 04-05; D-137, D-121, D-122, D-163, ER-7): the runner kind snapshot_restore_video runs the authored vce_pal fixture, under each of the three power-on policies, in calls to the deadlines of three schedules (1364 and 1366 master clocks, which fall at every
# phase inside a 1365-clock line, and 7) with a vid sink on every call. At every stop of the schedules 1364 and 1366, at every stride-th stop of the schedule 7 (the run is the first 600000 master clocks, about 440 lines: it holds both control register writes and the start of the palette writer, and
# keeps a restore at every stop cheap, about 0.7 ms each) and at every stop of it whose machine time is a multiple of 1365 (the next line event is pending at the machine time itself), the machine is snapshotted, restored into a fresh boot of the same image whose restorable members are poisoned,
# compared member by member with the source (ROM excluded) and the run goes on with the restored target. The machine time, the steps, the verdict RAM, the digest and the concatenated stream bytes of every chain must equal those of the uninterrupted run (memcmp of the stream, never hashes); a schedule
# 7 that restored at no stop at a multiple of 1365 is a guest_failure, so the tie is not left untested. Evidence tier E0: the core compared with itself (repeatability and consistency); no literal comes from a DuoSpool run, and the word pass is not a support claim.
id = "snapshot_restore_video"
kind = "snapshot_restore_video"
fixture = "authored:vce-pal"
request = ""
expect = "rom=vce-pal;schedules=1364,1366,7;stride=251"
meaning = "Snapshots of the first 600000 clocks of the vce_pal run taken at every stop of the 1364 and 1366 schedules and at strided and line-event stops of the 7 schedule, restored into a fresh poisoned instance and continued, give the machine time, steps, verdict RAM, digest and concatenated raw video stream of the uninterrupted run under three power-on policies"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 600000
