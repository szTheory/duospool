# Mutation sweep of the spr_basic fixture (plan 04.1-01; D-126, D-169, D-170, ER-4, ER-5, ER-7, F-41, FIX-03): the built image of fixtures/src/spr_basic.s (spr-basic) is loaded once, its DCK1 literal table is found at file offset $1000, and for each of the 6 checks the value byte of its entry (the expected literal) is XORed with $FF in a fresh
# in-memory copy that is booted and run in this same process. The unmutated image must pass first. Each mutation must flip exactly its own check to $46 and leave the others $50: a check whose literal can be changed without flipping it is vacuous and the case is guest_failure. The fixture has no observe-only row, so nothing is excluded (F-41).
# The sweep runs under the default power-on policy only. Evidence tier E0 (a mechanism check of the checks themselves): no accuracy or compatibility claim; the word pass is not a support claim.
id = "mutate_sweep_spr_basic"
kind = "mutate_sweep"
fixture = "authored:spr-basic"
request = ""
expect = "id=25"
meaning = "Changing the expected literal of any one of the 6 spr_basic checks flips exactly that check to fail and no other, so none of the 6 checks is vacuous"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 6000000
checks = 6
