# The record fault sweep of the scene video_bg_scroll of the bg_scroll ROM (plan 04-12; D-171, D-172, ER-10, ER-11): the runner kind video_fault_sweep runs the guest of the video case once, captures the raw records and the dev log, and for every group of the scene in fixtures/src/bg_scroll.vexp
# applies each fault the group declares in kills= to a copy of the records in memory (F0 perturbs the first number of the first row of the group; F1 shifts the dots of the focus line one dot, F7 zeroes every non-zero index and F8 swaps two adjacent lines, all at the line the group looks at first, which for a latch row is the line found from the write stamp)
# and requires the group to come out as a failure. A group that a declared fault leaves green, or on which the fault cannot act, is VIDEO_GROUP_VACUOUS and fails the case. For the next-line rows of BXR this sweep is the liveness evidence (F1 and F8 emulate a late or a missing latch; there is no renderer mutant for them, 04-VALIDATION.md A4).
# A group whose only kill is F0 proves only that its comparison is live (amendment A7). E0: a mechanism that shows each literal comparison live, no claim about any video, and the word pass is not a support claim.
id = "video_fault_sweep_bg_scroll"
kind = "video_fault_sweep"
fixture = "authored:bg-scroll"
request = ""
expect = "rom=bg-scroll;id=23;scene=video_bg_scroll"
meaning = "Every group of the video_bg_scroll turns into a failure under each record fault it declares (a pixel shifted, every index zeroed, two lines swapped, a perturbed literal), so no literal group of the scene is vacuous, E0"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 6000000
checks = 4
