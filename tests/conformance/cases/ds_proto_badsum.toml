# DSV1 protocol control (plan 03-05, D-124, D-95; the reading of D-124 recorded in plan 03-01): the variant writes a checksum one too large, and the judge, which recomputes the sum from raw RAM, gives guest_failure for the checksum.
# The ROM is one of the variants of fixtures/src/ds_proto.s that scripts/fixture-build assembles in the gate (never committed). The case passes only when the judge gives exactly the
# declared outcome and reason, so a judge that missed the fault would turn the case red. Evidence tier E0 (repeatability and a mechanism check of the verdict judge): no accuracy,
# compatibility or hardware claim, and the word pass here means the declared fault was caught.
id = "ds_proto_badsum"
kind = "guest"
fixture = "authored:ds-proto-badsum"
request = ""
expect = "id=1;verdict=guest_failure:checksum"
meaning = "A guest that writes a wrong checksum is caught: the judge recomputes the sum from raw work RAM and gives guest_failure"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 4000000
checks = 8
