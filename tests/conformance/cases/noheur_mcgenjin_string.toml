# No-heuristic row (D-70): a 1 MiB image with the text MCGENJIN at offset 0x1FD0, the place some emulators look for a mapper, declared plain, pce and none. The core never inspects content, so it loads as declared. Evidence tier E0 (repeatability and a literal), claims nothing about hardware.
id = "noheur_mcgenjin_string"
kind = "noheur"
fixture = "plain-1m"
request = "mapper=plain;order=pce;header=none"
expect = "str@0x1FD0=MCGENJIN"
meaning = "An image carrying MCGENJIN at offset 0x1FD0 and declared plain, pce and none loads as plain exactly as supplied, and every bank reads the bytes of the supplied buffer, so no content heuristic chooses a mapper"
required = true
control = false
expect_outcome = "pass"
pins = []
