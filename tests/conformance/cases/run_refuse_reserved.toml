# ds_run refusal run.reserved (plan 03-35; D-93, F4, T-03-94): a nonzero reserved field. The refusal carries 0 steps and overshoot 0, and the instance (raw bytes and digest) is the same before and after.
# The boot of the authored ds-proto has run past 600 master clocks first, so the instance is not at its boot state. Variants: reserved = 1, 0x80000000 and 0xFFFFFFFF, each with an otherwise valid request.
# Evidence tier E0 (repeatability and a literal): the refusal names and the non-mutation rule are the specification of this plan, not a hardware claim.
id = "run_refuse_reserved"
kind = "run_refuse"
fixture = "none"
request = ""
expect = "rom=ds-proto;refuse=reserved"
meaning = "A ds_run request with a nonzero reserved field is refused as run.reserved and leaves the instance byte-identical"
required = true
control = false
expect_outcome = "pass"
pins = []
