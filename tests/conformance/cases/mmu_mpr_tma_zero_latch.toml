# The model parameter tma_zero set to bus_latch (plan 03-17; D-105, D-113, ER-8): the authored fixture fixtures/src/mmu_mpr.s runs with the run-request key model.tma_zero=bus_latch, applied by ds_model_set after the boot and before the first step.
# The manual defines the TMA operand only as 2^i (S8-101), so TMA with the operand $00 is a modelling assumption (ASSUMED:LED-CPU-0015, status assumed). Check 49 is an observe-only row: the guest TAMs $F8 (the one-byte latch takes it), loads A with $5A, executes TMA #0
# and stores the A it sees. Under bus_latch the instruction returns the latch, so this case expects observe=49:248 ($F8); mmu_mpr_tma_zero_keep expects the other value of the parameter with the same ROM and gets $5A. The expected byte comes from the stated rule, never from a run.
# Evidence tier E0 and a labelled assumption: a pass says the core does what the parameter says, and nothing about the hardware.
id = "mmu_mpr_tma_zero_latch"
kind = "guest"
fixture = "authored:mmu-mpr"
request = "model.tma_zero=bus_latch"
expect = "id=8;observe=49:248"
meaning = "With the model parameter tma_zero set to bus_latch, TMA with the operand $00 returns the one-byte latch that the last TAM left, so the guest sees $F8"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 4000000
checks = 49
