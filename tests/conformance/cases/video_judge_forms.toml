# STRUCT: each closed check with its right literal, a wrong literal and F0. The null renderers (no record, all border, all index 0) never pass a form and a sink that was never written is a fault of the harness. The sweep flips a ROWS group under F0 F1 F2 F3 F4 F7 F8, reports a group left green by a declared fault as vacuous,
# and F6 keeps the stream well formed. E0; the rows are test data of the kind and no statement about a video.
