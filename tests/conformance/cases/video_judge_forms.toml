# The forms of the video judge on hand-built records (plan 04-07; D-171, D-172, ER-7, ER-13, T-04-24, T-04-26): the runner kind video_judge_forms (tests/conformance/videokinds.c) builds records from the layout of D-161 written in that file (test code, not a renderer, with no core, no emulator and no hash behind an expected
# value) and parses its rows with the parser of the .vexp.tsv reader.
# ROWS: index and value lists (plain and COUNT*V items), a second active line, a wrong index and a wrong value fail, dots outside the active window fail, the non-vacuity rule (fewer than 3 distinct values) is a fault of the case. REL: each relation id (scroll_x_shift, scroll_y_shift, palette_subst, blank_is_border,
