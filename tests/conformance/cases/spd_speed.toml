# The CPU speed switch seen from the guest, with the timer as the clock (plan 03-23; D-101, D-107, D-124, D-125, D-127, ER-3, ER-4; H8-18, H8-25): the authored fixture fixtures/src/spd_speed.s is assembled by ca65 in the gate (never committed), is booted on the core, runs to the absolute deadline
# until_mclk (master clocks) and writes a DSV1 verdict block that the runner judges from raw RAM. The fixture measures a fixed loop by the timer counter (a step every 3072 master clocks) before any switch, after CSH and after CSL, repeats a switch to the speed already in force, tunes two intervals to
# sit just past a step boundary so that the speed a CSH or CSL is charged at shows, and compares loops over the VDC, VCE and PSG windows with a work-RAM loop at both speeds. The expected counters are written by the assembler from the instruction counts of the source and classed in fixtures/src/spd_speed.checks: the power-up
# low speed and the one-byte length are manual facts (H8-18, H8-25); the ratio of the speeds, the cost of a switch and the VDC and VCE penalty are modelling assumptions (ASSUMED LED-CPU-0006 and LED-CPU-0017, written in plan 03-34). Every row that reads the counter is E2 self-consistency (ER-3): it depends on the
# community-reported 12 master clocks per CPU cycle at the low speed and on the access stamp rule (LED-CPU-0004), and can only show that the core agrees with itself. The case has no policies key, so the guest kind runs the ROM under its default policy list (D-127). The cycle counts and speed bytes of the
# switching instructions are judged from the trace by spd_speed_trace. Evidence tier E0 for the mechanism, E2 for the timer rows: no accuracy, CPU-speed or cycle-accuracy claim, and the word pass is not a support claim.
id = "spd_speed"
kind = "guest"
fixture = "authored:spd-speed"
request = ""
expect = "id=12"
meaning = "The authored spd_speed fixture measures with the timer that the CPU starts at low speed, that CSH and CSL change the loop rate, that a switching instruction is charged at the old speed and that the VDC and VCE window accesses cost one more cycle at the speed in force, and leaves a consistent DSV1 block of 13 passing checks (E2 self-consistency)"
required = true
control = false
expect_outcome = "pass"
pins = ["LED-CPU-0006"]
until_mclk = 4000000
checks = 13
