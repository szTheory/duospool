expect = "policy=zero;seed=none;ram=zero;mpr=zero;psg_noise=0x1;vdc_phase=0x0;time=0"
meaning = "Under the zero policy a boot lays down all-zero RAM and mapping registers, psg_noise 1, vdc_phase 0 and machine time 0, and records no seed"
