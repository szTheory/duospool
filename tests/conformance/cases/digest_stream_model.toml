# The selected value of a model parameter is machine state and is in the digest stream (plan 03-17; D-113, D-121): the same boot as digest_stream_prefix with the run-request key model.tma_zero=a_unchanged, applied by ds_model_set before the first step. The stream differs from that case in the last
# byte of the BUS0 frame only (the selection index of tma_zero: 1 = a_unchanged, where the default bus_latch is 0). The literal comes from the same throwaway perl script outside the repo as digest_stream_prefix (it first reproduced the committed version 3 digest, then appended the three-byte BUS0
# payload 00 00 01 and set the version to 4); the stream file it wrote hashes to the literal under shasum -a 256 (8390 bytes). Plan 03-22 (serial version 5) recomputed it the same way as digest_stream_prefix: the version 4 stream of this boot was checked against the committed literal 7fc0dc11...,
# then the version was set to 5 and the zero frames TIMR, IRQC and IRQS were appended (8588 bytes). Evidence tier E0: it pins the encoding of the selection byte and shows repeatability, never that the state is right.
# Plan 03-25 added the region BLKT (the block transfer in progress: active, opcode, alternation state, remaining count as a u32, source and destination as u16, 11 zero bytes for a boot) and the serial version 6, so the literal changed: a throwaway python script outside the repo took the 8588-byte version 5 stream of this boot with model.tma_zero=a_unchanged
# from the core's stream writer, checked that its sha256 equals the committed version 5 literal 69f3aae5... under shasum -a 256, set the version to 6 and appended the frame BLKT with 11 zero bytes; the 8607-byte stream it wrote hashes to the new literal. Evidence tier E0 (see above).
id = "digest_stream_model"
kind = "digest_stream"
fixture = "plain-256k"
request = "bind.powerup_policy=seeded-prng-v1;seed=42;model.tma_zero=a_unchanged"
expect = "version=6;frames=PROF:32,CONT:40,POWR:16,TIME:8,RAM8:8192,MPRS:8,CPU0:8,BUS0:3,TIMR:11,IRQC:3,IRQS:160,BLKT:11;size=262144;enum=1;digest=f8886a15de17cc7d6272227a4a3aaef161341eac5defaa4c39cb9a72cf8bedb9"
meaning = "With model.tma_zero=a_unchanged the digest stream is the one of the default boot except for the last byte of the BUS0 frame, and its SHA-256 equals the independently derived literal"
required = true
control = false
expect_outcome = "pass"
pins = []
