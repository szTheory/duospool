# The model parameter tma_zero set to a_unchanged (plan 03-17; D-105, D-113, ER-8): the same authored ROM as mmu_mpr_tma_zero_latch, run with model.tma_zero=a_unchanged.
# Under a_unchanged TMA with the operand $00 leaves A alone, so the guest, which loaded $5A before the instruction, sees $5A: observe=49:90. The two cases differ only in the parameter and in the expected byte, so a core that ignored the parameter fails one of them.
# A modelling assumption (ASSUMED:LED-CPU-0015, status assumed), E0, never a hardware claim.
id = "mmu_mpr_tma_zero_keep"
kind = "guest"
fixture = "authored:mmu-mpr"
request = "model.tma_zero=a_unchanged"
expect = "id=8;observe=49:90"
meaning = "With the model parameter tma_zero set to a_unchanged, TMA with the operand $00 leaves A as it was, so the guest sees the $5A it loaded"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 4000000
checks = 49
