# The device-register log of the authored cyc-probe (plan 03-19; D-119, D-106): the penalty section of the fixture runs ST0 #$22 at logical $E182, a read of the VDC window, STA $0400 (a write to the VCE window) at $E187 and further reads, with MPR0 = $FF. The dev sink
# must hold exactly two records, in order: (1) pc $E182, kind ST (the physical write of ST0), physical address $1FE000 (H8-8 Table 2-2-3, S8-80: ST0 writes the VDC address register at $1FE000), value $22 (the immediate of the fixture source, GUEST);
# (2) pc $E187, kind W (a write through the mapping registers), physical address $1FE400 (the VCE window starts at $1FE400, H8-9), value A (the byte the accumulator held, read from the insn record of that pc, so no literal of DuoSpool output). Each
# record's stamp must equal the start stamp of the insn record at its pc, its pc field must be that pc, its flags must carry the penalty bit for an address below $1FE800 (D-107, ASSUMED:LED-CPU-0017) and, for ST, the physical bit, and its spare bytes must be zero. The reads of
# the VDC window ($0000), of $07FF, $0800 and $0C00 and the zero-page read are not logged (D-119 logs reads of the $1000 window only). The pcs come from the ca65 listing of the second subroutine as in case vdc_penalty_assumed. Evidence tier E0 for the log layout
# against the case's literals; no accuracy, compatibility, cycle-accurate or hardware claim, and the word pass is not a support claim.
id = "dev_log_records"
kind = "dev_log"
fixture = "none"
request = ""
expect = "mode=guest;rom=cyc-probe;rec=0xE182:ST:0x1FE000:0x22;rec=0xE187:W:0x1FE400:A"
meaning = "With a device-register sink on cyc-probe the log holds the ST0 physical write to $1FE000 and the VCE window write to $1FE400 in order, with the ST kind and physical flag on the ST0 record, the instruction's stamp and pc on each, and nothing for the reads of the VDC and timer windows"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 4000000
