#
# The encoding of the regions TIMR, IRQC and IRQS with nonzero bytes (plan 03-22; D-110, D-111, D-112, D-121): the boot is the one of digest_stream_prefix with the run-request key model.irq_i_sample=post, the declared stimulus below (three events, two at the same time: equal times are legal) and the expect item poke=timer-irq, which makes the
# runner write timer_origin $0102030405060708, timer_counter $11, timer_reload $22, timer_enabled 1, irq_disable 5 and tiq_latch 1 into the booted instance before the capture (a test hook: a boot leaves them zero). The payloads are then TIMR 08 07 06 05 04 03 02 01 11 22 01, IRQC 05 01 01 and IRQS 16 slots of a u64 time, the line and the level, the unused 13 zero.
# The literal comes from a throwaway python script outside the repo that rebuilt the version 4 stream of this boot, checked it against the committed literal 5065a6c1... under shasum -a 256, set the version to 5 and appended the three frames written byte by byte from the rules above; the stream file
# it wrote (8588 bytes) hashes to the literal under shasum -a 256. Evidence tier E0: it pins the encoding and shows repeatability, never that the state is right.
id = "digest_stream_irq"
kind = "digest_stream"
fixture = "plain-256k"
request = "bind.powerup_policy=seeded-prng-v1;seed=42;model.irq_i_sample=post"
expect = "version=5;frames=PROF:32,CONT:40,POWR:16,TIME:8,RAM8:8192,MPRS:8,CPU0:8,BUS0:3,TIMR:11,IRQC:3,IRQS:160;size=262144;enum=1;poke=timer-irq;digest=a65a4f8ef2e9581329046844d367627eae784e1b9e28aed7cd82b36855213f38"
meaning = "With nonzero timer, controller and stimulus state the regions TIMR, IRQC and IRQS carry the documented little-endian bytes, the payloads match the instance, and the SHA-256 of the stream equals the independently derived literal"
required = true
control = false
expect_outcome = "pass"
pins = []
irq_stim = ["1234567890123,2,1", "1234567890123,1,0", "9999999999999,1,1"]
