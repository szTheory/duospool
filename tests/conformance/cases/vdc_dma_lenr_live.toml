#
# Restore at every stop of a VRAM-to-VRAM transfer whose LENR low byte is rewritten while it runs (review fix H-01; D-151, D-137, D-166): the runner kind vdc_dma_lenr_live (tests/conformance/vdckinds.c) runs the authored cpu-alu image, whose guest never touches the VDC, and drives the VDC directly at the machine time between runs.
# SOUR = DESR = 0 and LENR = $FFFF start the transfer; after 60,000 words the low byte is written $FF; after 5,600 more words (the review's repro: past 65,536 words since the start) the machine stops; then the low byte is written $FF every 128 words 1,100 times, which keeps the transfer alive past three times 65,536 words, with a stop after every 32nd write; then the transfer ends.
# At every stop the progress member dma_done is 0 and dma_start is at most one word time behind the machine time while the transfer runs (no member counts the words since the start, so nothing can wrap at 2^32 words; a 2^32-word run itself is not run), and the machine is snapshotted and restored into a poisoned twin booted under another seed,
# and the run goes on with the twin; the chain must equal the uninterrupted run in machine time, steps, digest and every member. The word time 16 (4 dots, ASSUMED LED-VID-0014, times the divider 4 of CR 0, MAN H6-3) is written in the kind. Evidence tier E0: the core against itself, no accuracy, compatibility or hardware claim, and the word pass is not a support claim.
id = "vdc_dma_lenr_live"
kind = "vdc_dma_lenr_live"
fixture = "authored:cpu-alu"
request = ""
expect = "first=60000;lsb=255;then=5600;keep=1100;every=32"
meaning = "A transfer kept alive by LENR low-byte writes past 65,536 and past three times 65,536 words restores at every stop and continues to the same machine time, steps, digest and members as the uninterrupted run, with its progress member 0 at every stop, E0 repeatability"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 3400000
