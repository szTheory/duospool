#
# Restore at every instruction boundary of one short fixture (plan 03-30 task 3; CORE-05, D-122): every boundary of the ds_proto run to a deadline past its done state, with one poison byte per boundary (0xA5 at even, 0x5A at odd boundaries), the raw compare, the digest and a lockstep window of four
# steps after each restore. The runner (kind snapshot_restore, tests/conformance/snapkinds.c) runs the fixture once, uninterrupted, one step at a time, keeping the machine time, pc, opcode and record fold of every step and a copy of the machine at the deadline; a second run of the same fixture is
# stopped at each planned boundary, snapshotted and restored into a FRESH instance booted with another seed, the defaults of the model parameters, no schedule and no stimulus, whose restorable members are then poisoned (0xA5, and again 0x5A). The restored instance must equal the source in every member
# of the hand-written tiling list except the ROM (raw compare), re-serialise to the same snapshot, run in lockstep with the uninterrupted run over the window, and, at the lead stop of each class (finish), end the run with the machine time, verdict RAM, digest and members of the uninterrupted run; at
# the lead stops flipping one byte of every region of the restored instance changes the digest (perturb). Evidence tier E0: the core compared with itself; no correctness claim.
id = "snapshot_restore_boundaries"
kind = "snapshot_restore"
fixture = "authored:ds-proto"
request = "bind.powerup_policy=seeded-prng-v2;seed=3"
expect = "boundaries;window=4"
meaning = "Every instruction boundary of ds_proto restores into a fresh poisoned instance, equal to the source in every member except the ROM and in lockstep with the uninterrupted run for four steps"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 150000
