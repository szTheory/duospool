# An interrupt that becomes pending during a block transfer (plan 03-25; D-92, D-100, D-111, ASSUMED LED-IRQ-0007, plan check B3): the irq image of fixtures/src/cpu_blk.s (assembled with -D BLK_IRQ, never committed) starts the timer at reload 0 with I clear and runs a TII of 4096 bytes. The timer borrows every
# prescaler step (3072 master clocks) during the 294912-clock transfer and the case raises IRQ2 inside it with the declared test stimulus below (irq_stim: events AT,LINE,LEVEL in master clocks; a test hook, never a claim about the VDC, ER-5, D-112). The guest keeps IRQ1D set and reads the IRQ1 level as its synchronisation line:
# it polls the request register, so the transfer starts a few hundred clocks after the rise of the IRQ1 level at 2000000, and IRQ2 rises 100000 clocks later, inside the transfer wherever the poll caught the first line (the transfer ends about 296000 clocks after 2000000). The window of IRQ1 ends at 2400000, after the transfer.
# Checks 43 to 50 then say that the handlers ran only after the epilogue (all 4096 destination bytes already written, A, X and Y equal to their values before the transfer at the timer handler's entry and after both handlers), that the timer interrupt came once and before IRQ2, and that the return address the
# entry pushed is the instruction after the transfer. These are the assumed model of LED-IRQ-0007 (the manual states no sample rule for block transfers); the chunk and observer coverage of the same stops is plan 03-26. Evidence tier E0: no accuracy, compatibility or hardware claim, and the word pass is not a support claim.
# Ledger pin: this case is the intended pin of LED-IRQ-0007 (no interrupt sampled inside a block transfer); the entry is not written yet (plans 03-26 and 03-32), so pins is empty here and the back-link is set with the entry (inventory-check refuses a pin whose entry does not name the case).
