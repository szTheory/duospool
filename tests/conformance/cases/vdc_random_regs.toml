# Random VDC and VCE register programs (plan 04-13; D-175, T-04-44): the runner kind vdc_random_regs (tests/conformance/vdckinds.c) builds 32 programs in memory from a fixed seed (rp_build_vdc in tests/conformance/randprog.c: nothing but writes of random values to every VDC register through AR and the data port, to the VCE window and to the DMA
# and geometry registers, reads of the status and data ports, block transfers of up to 64 bytes into the data ports and counted waits) and runs each to one deadline with a vid sink whose capacity is the closed form of the line count at the longest record. Every program must stop at the deadline, lose no record, give the closed-form count
# floor((M - 1) / 1365) + 1 (ASSUMED LED-VID-0004 and LED-VID-0001, written in the kind) and hold only whole records whose border, indices and colour values are below 512. The case runs in the gate preset and again in the sanitize preset (ASan and UBSan, no recover), where an out-of-range index, an overflow or a heap error in the renderer or
# the DMA engine is a crash. Evidence tier E0: the core is shown survivable and bounded, not correct; nothing is compared with any oracle, no accuracy or hardware claim, and the word pass is not a support claim.
id = "vdc_random_regs"
kind = "vdc_random_regs"
fixture = "none"
request = ""
expect = "programs=32;seed=0x56445252"
meaning = "32 seeded random programs that write random values to every VDC register, the VCE window and the DMA triggers each run to their deadline with no crash under the gate and sanitizer presets, no lost record, the closed-form record count and every border, index and colour value below 512, E0 repeatability"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 1200000
