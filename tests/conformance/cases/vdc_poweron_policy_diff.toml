# The power-on policy guard (plan 04-13; D-167, D-175, Pitfall 13, T-04-45): the runner kind vdc_poweron_policy_diff (tests/conformance/vdckinds.c) runs every video fixture (the fixtures that have a .vexp file) under the zero policy and under seeded-prng-v3 with seeds 1 and 2, with a vid sink, to one deadline. The verdict RAM (the DSV1
# bytes) and every line record from the first judged frame on (the number after the at sign) must be byte for byte equal under the three policies: a fixture writes every VRAM, SATB and palette cell its judged lines read before they are judged, so the power-on content must not reach a judged record. The frames before that number are the
# setup frames of the fixture, in which an uninitialised cell may show. The control image vce-pal-nopal is the vce_pal fixture with the palette initialisation left out: its border entry keeps the power-on value, so the border of some record in the window must DIFFER between the zero policy and each seed, which shows
# that the guard can fail (it is a guard that passes on every input otherwise). The first judged frames (the numbers after the at signs) are E0 calibration values read from one DuoSpool run: the kind requires each to equal the frame after the last record that differs between the policies, so they record where the setup ends on this core and
# are not literals from a page or an in-guest computation (review fix M-05 of the gate review). What the case asserts is the policy independence of every record from that frame on, with a window of at least one frame (262 records); a later frame would only weaken it. Evidence tier E0: the core compared with itself under three policies;
# no accuracy or hardware claim, and the word pass is not a support claim. Plan 04.1-01 added spr-basic@2 and found that bg-enab drew random sprites under a seeded power-on once the core drew sprites (it set SB without initialising the SATB): the fixture now zeroes the SATB first (Rule 1, recorded in the plan summary).
id = "vdc_poweron_policy_diff"
kind = "vdc_poweron_policy_diff"
fixture = "none"
request = ""
expect = "roms=vce-pal@5,vce-dot@1,bg-basic@2,bg-scroll@2,bg-enab@2,spr-basic@2;control=vce-pal-nopal@0"
meaning = "Under the zero policy and two seeded-prng-v3 seeds the six video fixtures give the same verdict RAM and the same line records from the first judged frame on, while the vce_pal image whose palette is never initialised gives a different border, so the power-on guard is shown able to fail, E0 repeatability"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 6000000
