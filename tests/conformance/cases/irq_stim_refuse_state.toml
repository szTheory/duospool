# Stimulus refusal row (plan 03-22; D-112, T-03-60, F4): the declared IRQ1 and IRQ2 test stimulus is validated by the core when the runner gives it over (ds_irq_stim_set, before the first step), so a bad list is refused with a typed code of src/core/stim_refusals.def and the
# instance is left byte-identical. This row is a valid list given after the machine has taken a step (the case until_mclk is 600): the state check is the last of the set. The kind is guest with the expect item refused=stim.NAME: the built image of irq_ctl is booted, a valid list is first proven
# accepted and cleared (a core that refused everything must fail), then the list below must come back as exactly the named
# code, and the guest is never run. The stimulus is a test hook, not evidence about the VDC or any hardware source (ER-5, ASSUMED LED-IRQ-0008). Evidence tier E0. The deferred case irq_stim_refusal_coverage checks that every code of the .def is observed by a row.
id = "irq_stim_refuse_state"
kind = "guest"
fixture = "authored:irq-ctl"
request = ""
expect = "id=11;refused=stim.state"
meaning = "A valid irq_stim list given after the machine has taken a step, and a count of 0, are refused as stim.state with the instance unchanged; a NULL instance is refused the same way"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 600
checks = 15
irq_stim = ["1000,1,1", "2000,2,0"]
