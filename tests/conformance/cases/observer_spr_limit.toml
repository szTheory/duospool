# The observer non-interference matrix on the sprite fixture (Phase 4.1 review fix M-04; D-119, D-155, D-162, D-164, F-2, CORE-06): the authored spr_limit runs under two power-on policies (zero and seeded-prng-v3 seed 1, the policies key) in each of the modes whole, chunk:7 and stop:5000,
# once with no sink and once per configuration with all three sinks (insn, dev and vid: large, drop4, poison, cap0, cap1). Every run must end with the stop reason, machine time, steps, verdict RAM, digest and stop sequence of the run with no sink, and the vid header must count whole records
# against the closed-form line count (ASSUMED LED-VID-0004 and LED-VID-0001, written in the kind). The deadline, 1,900,000 master clocks, holds the sprite scenes of the frames 4 and 5, so the chunk:7 mode stops inside display lines whose sprite flags are pending.
# Evidence tier E0: the core compared with itself; no accuracy or hardware claim, and the word pass is not a support claim.
id = "observer_spr_limit"
kind = "observer"
fixture = "authored:spr-limit"
request = ""
expect = "compare=verdict,machine_time,stops,digest"
meaning = "Enabling the instruction, device-register and vid sinks in any of five configurations, whole or in 7 chunks or stopped by the callback, changes neither the verdict RAM, the machine time, the stop sequence nor the digest of a spr_limit run through sprite scenes under two power-on policies"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 1900000
sinks = "large,drop4,poison,cap0,cap1"
chunks = "whole,chunk:7,stop:5000"
policies = "||bind.powerup_policy=seeded-prng-v3;seed=1"
