# Chunk equivalence of the audio streams of psg_lfo (plan 05.1-02; D-200, D-201, C-12, PR-11, F-71; the chunk_equiv_audio_psg_mod shape): kind chunk_equiv with the compare item audio runs psg_lfo to one absolute deadline in one call and in calls to the deadlines of five
# schedules: 7, 191 and 193 (one clock either side of the 192-clock sample grid), 1366 and vframe (one frame of 262 lines). Every call's pcm header must read first = ceil(T0 / 192) and seq = ceil(T1 / 192) - first, first(i+1) = first(i) + seq(i), and the concatenated DSPE
# records and DSPA frames must memcmp-equal the uninterrupted run, beside its machine time, steps, verdict RAM, stop sequence and digest. until_mclk = 8,000,000 is past both the stamp 3,509,820 of the lfo_dynamic R9 $01 record plus 2 x 115,200 (two coupled select-1 steps) = 3,740,220
# and the DSV1 done state of psg_lfo (7,951,284 in a run of audio_lfo_dynamic), which kind chunk_equiv requires before its deadline (D-95), unlike the other three proof-set cases (they stop at 3,750,000); so the
# chunk boundaries cross the coupled select-1 fold of lfo_dynamic. Evidence tier E0 repeatability; no hardware claim.
id = "chunk_equiv_audio_psg_lfo"
kind = "chunk_equiv"
fixture = "authored:psg-lfo"
request = ""
expect = "compare=verdict,machine_time,stops,digest,audio"
meaning = "psg_lfo run with a psg and a pcm sink in calls to the deadlines of five chunk schedules (7, 191, 193, 1366 and one frame of 262 lines), through the coupled scene lfo_dynamic to past its DSV1 verdict, ends with the machine time, steps, verdict RAM, stop sequence, digest and concatenated DSPE and DSPA bytes of the uninterrupted run, E0 repeatability"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 8000000
chunks = "7,191,193,1366,vframe"
