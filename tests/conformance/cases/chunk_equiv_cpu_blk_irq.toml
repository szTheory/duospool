# Chunk invariance of a block transfer with interrupts pending (plan 03-26, plan check B3; D-92, D-93, D-100, D-111, CORE-04, CPU-05, ER-7): the irq image of fixtures/src/cpu_blk.s (assembled with -D BLK_IRQ, never committed) runs a TII of 4096 bytes with the timer borrowing every prescaler step and
# an IRQ2 level raised inside the transfer by the declared test stimulus below (irq_stim: events AT,LINE,LEVEL in master clocks;
# a test hook, never a claim about the VDC, ER-5, D-112). The guest keeps IRQ1D set and polls the IRQ1 level as its synchronisation line, so the stimulus is the same as in cpu_blk_irq_pending (the guest is done at about 2.41 million master clocks, the deadline is above 2.5 million). The case runs in
# calls to the deadlines of seven schedules (chunks key: 1, 7, 168 and 3072 master clocks, a fixed 357368, 3072k-1 and 3072k+1) and requires of every schedule
# a call that took a step and ended at a block byte stop with the timer interrupt (TIQ) and IRQ2 both pending at the stop stamp (pending-stop: the pure query ds_irq_pending_query of plan 03-22 at the machine time of the stop, after the disable mask, equals bits 0 and 2): the interrupt is not taken
# inside the transfer, and the stop and the resume in the middle of it change nothing. Each schedule must end with the machine time, the step count, the verdict RAM, the digest and the sequence of step boundaries (the stop sequence) of the uninterrupted run to the same absolute deadline past the
# guest's done state. A snapshot does not exist yet (plan 03-30), so equality is of outputs, machine time, stop sequence and digests. Evidence tier E0: the core compared with itself (repeatability and consistency, ER-7); no accuracy, compatibility, cycle-accurate or hardware claim, and the word pass
# is not a support claim. The toy control block-progress-lost must turn this case red.
id = "chunk_equiv_cpu_blk_irq"
kind = "chunk_equiv"
fixture = "authored:cpu-blk-irq"
request = ""
expect = "compare=verdict,machine_time,stops,digest;pending-stop"
meaning = "The irq image of the cpu_blk fixture, stopped inside its 4096-byte transfer with the timer interrupt and IRQ2 pending by seven chunk schedules, ends with the machine time, step count, verdict RAM, stop sequence and digest of the uninterrupted run"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 2600000
chunks = "1,7,168,3072,frame,tick-1,tick+1"
irq_stim = ["2000000,1,1", "2100000,2,1", "2400000,1,0"]
