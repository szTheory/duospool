# Mutation sweep of the vdc_irq fixture (plan 04-17; D-126, D-169, D-170, ER-4, ER-5, ER-7, F-41, FIX-03): the built image of fixtures/src/vdc_irq.s (vdc-irq) is loaded once, its DCK1 literal table is found at file offset $1000, and for each of the 12 judged checks the value byte of its entry (the expected literal or XOR mask) is XORed with $FF in a fresh in-memory copy
# that is booted and run in this same process. The unmutated image must pass first.
# Each mutation must flip exactly its own check to $46 and leave the others $50: a check whose literal can be changed without flipping it is vacuous and the case is guest_failure. Rows 13 to 16 are observe rows (raw measurements judged by vdc_irq_agree): exclude equals the observe list of the fixture exactly (F-41).
# The sweep runs under the default power-on policy only. Evidence tier E0 (a mechanism check of the checks themselves): no accuracy or compatibility claim; the word pass is not a support claim.
id = "mutate_sweep_vdc_irq"
kind = "mutate_sweep"
fixture = "authored:vdc-irq"
request = ""
expect = "id=18;exclude=13,14,15,16"
meaning = "Changing the expected literal of any one of the 12 judged vdc_irq checks flips exactly that check to fail and no other, so none of the 12 judged checks is vacuous; the 4 observe rows are excluded"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 2100000
checks = 16
