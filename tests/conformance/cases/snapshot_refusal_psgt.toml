# The PSG restore domain (plan 05-03; D-203, D-231, T-05-08, T-05-09): a mid-run snapshot of ds_proto is edited one defect per row (snapkinds.c, rows p-*: PSG0 is first zeroed and every channel distance set to 0, a valid all-frozen state) and restored.
# This case holds the counter and LFSR rows; snapshot_refusal_psg holds the register and wave rows. Refused as field: a select above 7, a frequency above $FFF, R4 bit 5, a wave index or DDA latch above 31, noise bits 5-6, LFO control bits 2-6, a wave byte above 31, DDA with a non-zero wave index, a pending event on a channel frozen by chON 0, by DDA or (select 1)
# by TRG, a running channel with no pending event, a distance above 24,576 (a running select 1 above the coupled bound 6,291,456 whatever the coupling, plan 05.1-01, 05.1-CONTEXT C-09: one grid step past 24,576 and the coupled maximum are accepted),
# a noise distance of 0 or above 11,904, a channel or noise event off the tick grid of d = 6, and an LFSR of 0 or $40000. Each range row is on the grid, so it fails only its range.
# Accepted: every boundary value (select 7, $FFF, $9F, $83, wave 31, the largest on-grid distances, LFSR $3FFFF) and select 1 under TRG with wave index 5 (D-231: R6 writes under TRG advance it, so the state is reachable). Evidence tier E0: the domain is the project's rule (D-203).
id = "snapshot_refusal_psgt"
kind = "snapshot_refuse"
fixture = "authored:ds-proto"
request = "bind.powerup_policy=seeded-prng-v2;seed=3"
expect = "p-offrem=field|p-ddarem=field|p-trgrem=field|p-onrem0=field|p-remmax=accept|p-remover=field|p-rem1max=accept|p-rem1over=accept|p-rem1coupled=accept|p-rem1coupover=field|p-remgrid=field|p-nrem0=field|p-nremmax=accept|p-nremover=field|p-nremgrid=field|p-lfsr0=field|p-lfsr4=field|p-lfsrmax=accept"
meaning = "A snapshot whose PSG counter distances or LFSRs lie outside the D-203 domain is refused as snapshot.field with the instance byte-identical; the largest on-grid distances and the LFSR $3FFFF are accepted; a running select 1 has the coupled bound 6,291,456 (plan 05.1-01, C-09)"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 100000
