# Restore with a running timer (plan 03-30 task 3; CORE-05, D-109, D-121): the tim_timer fixture starts the timer, reads its counter and takes the timer interrupt; every 61st boundary is restored, so the origin of the prescaler phase, the counter, the reload and the start bit (region TIMR) and the TIQ
# latch (IRQC) of a running timer are part of the restored state and the counter reads that follow in the lockstep window come from them. The runner (kind snapshot_restore, tests/conformance/snapkinds.c) runs the fixture once, uninterrupted, one step at a time, keeping the machine time, pc, opcode and
# record fold of every step and a copy of the machine at the deadline; a second run of the same fixture is stopped at each planned boundary, snapshotted and restored into a FRESH instance booted with another seed, the defaults of the model parameters, no schedule and no stimulus, whose restorable
# members are then poisoned (0xA5, and again 0x5A). The restored instance must equal the source in every member of the hand-written tiling list except the ROM (raw compare), re-serialise to the same snapshot, run in lockstep with the uninterrupted run over the window, and, at the lead stop of each
# class (finish), end the run with the machine time, verdict RAM, digest and members of the uninterrupted run; at the lead stops flipping one byte of every region of the restored instance changes the digest (perturb). Evidence tier E0: the core compared with itself; no correctness claim.
id = "snapshot_restore_timer"
kind = "snapshot_restore"
fixture = "authored:tim-timer"
request = "bind.powerup_policy=seeded-prng-v2;seed=3"
expect = "stops=first,last,kth:61;window=32;finish;perturb"
meaning = "Snapshots of the tim_timer run taken at every 61st boundary, with the timer running, restore into a fresh poisoned instance and continue as the uninterrupted run"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 600000
