# ds_model_set refusal model.unknown_name (plan 03-17; D-113, F4, T-03-47): a name that is NULL, empty, a prefix or an extension of tma_zero, in another case, with a space or a vertical bar, or another row's name. The name is checked before the value, so a NULL value beside a bad name is still unknown_name.
# Every variant must return the code, write nothing (the whole instance, raw bytes and digest, is byte-identical afterwards) and leave the selected value where it was. The authored ds-proto is booted first; the model codes are their own set and print as model.NAME, never load.NAME or run.NAME.
# Evidence tier E0 (a mechanism check of a setter against the closed refusal set of src/core/model_refusals.def): the refusal names and the order of the checks are the specification of this plan, not a hardware claim.
id = "model_refuse_unknown_name"
kind = "model_refuse"
fixture = "none"
request = ""
expect = "rom=ds-proto;refuse=unknown_name"
meaning = "A model parameter name that is NULL, empty or not exactly a row of model_params.def is refused as model.unknown_name and leaves the instance byte-identical"
required = true
control = false
expect_outcome = "pass"
pins = []
