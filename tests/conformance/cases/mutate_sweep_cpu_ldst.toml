# Mutation sweep of the load, store, transfer and stack fixture (plan 03-11; D-126, ER-7, FIX-03): the built image of fixtures/src/cpu_ldst.s is loaded once, its DCK1 literal table is found at file offset $1000, and for each of the 82
# checks the value byte of its entry is XORed with $FF in a fresh in-memory copy that is booted and run in this same process. The unmutated image must pass first. Each mutation must flip exactly its own check to $46 and leave the
