# A block transfer can stop at every step and resume (plan 03-25; D-92, D-93, D-95, D-100, CORE-04): the plain image of fixtures/src/cpu_blk.s runs on a fresh boot to one absolute deadline in a single call (the reference, past the guest's DSV1 done state) and then, on fresh boots, in calls whose deadlines advance by 1, 7, 168 and
# 3072 master clocks and by those four sizes in rotation. A block transfer is three kinds of step (the prologue, one step per byte of 6 cycles = 72 clocks at the low speed, and the epilogue), so every one of those lists ends a call inside a transfer many times: a chunk of 1 or 7 clocks ends after every step, 168 clocks (14 cycles) after about every
# second byte, 3072 after about every 42nd. Each list must end with the same machine time, the same step count, the same CPU registers and the same digest as the reference: a core that loses the progress of a transfer when a run stops would move a byte twice or not at all and differ. The comparison is of runs with each other, so the evidence tier is E0, repeatability only; no literal here
# comes from a DuoSpool run, and the word pass is not a support claim. The toy control block-progress-lost must turn this case red (tests/controls/block-progress-lost).
id = "cpu_blk_stop_resume"
kind = "run_chunk_sum"
fixture = "none"
request = ""
expect = "rom=cpu-blk;until=1150000;chunks=1,7,168,3072,mix"
meaning = "Running the cpu_blk guest, which performs block transfers of up to 4096 bytes, to one absolute deadline in chunks of 1, 7, 168 and 3072 master clocks and in a rotation of them, every list stopping inside block transfers, gives the machine time, step count, CPU registers and digest of the one-call run"
required = true
control = false
expect_outcome = "pass"
pins = ["LED-CPU-0008"]
