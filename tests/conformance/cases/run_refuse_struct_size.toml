# ds_run refusal run.struct_size (plan 03-35; D-93, F4, T-03-94): a request whose struct_size is not sizeof(struct ds_run_request) is refused as run.struct_size, with 0 steps and
# overshoot 0, and the instance (raw bytes and digest) is the same before and after. The boot of the authored ds-proto has run past 600 master clocks first, so the instance is not at its boot state.
# Variants: sizeof - 1, + 1, + 4, 0, 0xFFFFFFFF and, since plan 04-02 appended the vid member, the OLD size (sizeof minus one pointer: an ABI-skew control for a host built against the layout before the video sink). A refusal that wrote machine time, registers or RAM would change the bytes and fail the case.
# Evidence tier E0 (repeatability and a literal): the refusal names and the non-mutation rule are the specification of this plan, not a hardware claim.
id = "run_refuse_struct_size"
kind = "run_refuse"
fixture = "none"
request = ""
expect = "rom=ds-proto;refuse=struct_size"
meaning = "A ds_run request with a wrong struct_size is refused as run.struct_size and leaves the instance byte-identical"
required = true
control = false
expect_outcome = "pass"
pins = []
