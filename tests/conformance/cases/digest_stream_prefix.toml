#
# The state digest is SHA-256 of a framed stream, never of struct bytes (D-52). The kind captures the stream with ds_digest_stream and parses it
# here without calling ds_digest: the prefix duospool-state and a NUL byte, the serializer version 6, then twelve regions each framed as four
# ASCII tag bytes, a u32 length and the payload, little-endian, in the fixed order PROF CONT POWR TIME RAM8 MPRS CPU0 BUS0 TIMR IRQC IRQS BLKT (plan 03-03 and plan 03-16, D-121; PSGN and VDCP left the stream; CPU0 is a x y s p, pc as a u16, speed; BUS0 is io_buffer, mpr_latch and the selection index of the model parameter tma_zero, three bytes, all 0 at boot). Each payload is
# checked against the booted instance, the stream must be consumed exactly, and the SHA-256 of the captured stream must equal ds_digest and the
# literal below. The literal comes from a throwaway perl script outside the repo (Digest::SHA and Math::BigInt) that wrote the stream of the
# written rules for a seed-42 boot of plain-256k: the content sha256 is the host shasum of the emitted recipe, the RAM and registers are the
# splitmix literals of poweron_draw_order, and the CPU0 bytes are the reset state written in the plan 03-01 rules (a x y s 0, p = the I bit,
# speed 0, pc = the reset vector at file bank 0 offsets 8190 and 8191 of the recipe image, BUS0 = three zero bytes). The literal was recomputed for serial version 4 (plan 03-17, BUS0 gained the tma_zero selection byte) by the same kind of throwaway perl script, which first
# rebuilt the version 3 stream and reproduced the committed version 3 digest af54a963... (which in turn had reproduced the version 2 digest eddf37b1...), so every piece of the stream was cross-checked before the third BUS0 byte was appended and the version changed; the version 4 stream file it wrote
# hashes to the literal under shasum -a 256 (8390 bytes).
# Plan 03-22 added the regions TIMR (the timer origin as a u64 and counter, reload and start bit, 11 bytes), IRQC (disable mask, TIQ latch and the irq_i_sample selection, 3 bytes) and IRQS (the 16 slots of the declared stimulus, 160 bytes) and the serial version 5. Every one is all zero at boot
# under this request, so the literal was derived by a throwaway python script outside the repo that first rebuilt the version 4 stream from the code, checked that it hashes to the committed version 4 literal 5065a6c1... under shasum -a 256, set the version to 5 and appended the three frames (TIMR 11
# zero bytes, IRQC 3, IRQS 160); the stream file it wrote (8588 bytes) hashes to the new literal under shasum -a 256. Evidence tier E0: it pins the encoding and shows repeatability, never that the state is right.
# Plan 03-25 added the region BLKT (the block transfer in progress: active, opcode, alternation state, remaining count as a u32, source and destination as u16, 11 zero bytes for a boot) and the serial version 6, so the literal changed: a throwaway python script outside the repo took the 8588-byte version 5 stream of this boot
# from the core's stream writer, checked that its sha256 equals the committed version 5 literal b10fea3a... under shasum -a 256, set the version to 6 and appended the frame BLKT with 11 zero bytes; the 8607-byte stream it wrote hashes to the new literal. Evidence tier E0 (see above).
# Plan 03-29 added the regions IOPT (the latch of port O and the device kind of each of the five ports, 6 bytes: FF 01 00 00 00 00 at boot) and SCHD (the declared input schedule, 1024 slots of 16 bytes and the count and a reserved word, 16392 zero bytes for a run with no input) and the serial version 7, so the literal changed: a throwaway C
# program outside the repo booted this request and wrote the 8607-byte version 6 stream with the core's stream writer, which hashes to the committed version 6 literal 518d1ebfb84edd8ecf1166d76ca9c91e5457ea3f23218dbbf2f7c215b110fa0d under shasum -a 256; a throwaway python script outside the repo then set the version to 7 and appended the
# frames IOPT (6 bytes) and SCHD (16392 zero bytes) written from the rules above, and the 25021-byte stream it wrote hashes to the new literal under shasum -a 256. Evidence tier E0 (see above).
# Plan 04-03 (the one Phase 4 bump: serial version 8, seven regions VCE0, PALT, VDC0, BEAM, VDMA, VRAM, SATB appended after SCHD) changed the literal. Method (D-165, Pitfall 1): the 25021-byte version 7 stream of this case was
# dumped by a scratch copy of the version 7 tree, and shasum -a 256 of it equalled the committed version 7 literal a24223b0... before anything else was done; a throwaway python script outside the repo, which never called the new
# core, then set the version to 8 and appended the seven frames written by hand from the D-165 layout (VCE0 3, PALT 1024, VDC0 45, BEAM 33, VDMA 25, VRAM 65536 and SATB 512 bytes, all zero except BEAM, whose rcr_counter 16384 (bytes
# 00 40 at payload offset 14), frame_lines 262 (06 01 at 16) and display_k 0xFFFF (FF FF at 12) are the boot values of the rules, F-11); the 92255-byte stream it wrote hashes to the new literal under shasum -a 256. Evidence tier E0:
# it pins the encoding and shows repeatability, never that the state is right.
id = "digest_stream_prefix"
kind = "digest_stream"
fixture = "plain-256k"
request = "bind.powerup_policy=seeded-prng-v1;seed=42"
expect = "version=8;frames=PROF:32,CONT:40,POWR:16,TIME:8,RAM8:8192,MPRS:8,CPU0:8,BUS0:3,TIMR:11,IRQC:3,IRQS:160,BLKT:11,IOPT:6,SCHD:16392,VCE0:3,PALT:1024,VDC0:45,BEAM:33,VDMA:25,VRAM:65536,SATB:512;size=262144;enum=1;digest=588a0c69fd755911f50a7d810ab7e10387da7862f67b7ff921a0eb28dd4a8249"
meaning = "The digest stream is the framed, little-endian stream of twenty-one regions behind the prefix and version, its payloads match the instance, and ds_digest is the SHA-256 of exactly that stream and of the independently derived literal"
required = true
control = false
expect_outcome = "pass"
pins = []
