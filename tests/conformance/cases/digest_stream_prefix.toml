#
# The state digest is SHA-256 of a framed stream, never of struct bytes (D-52). The kind captures the stream with ds_digest_stream and parses it
# here without calling ds_digest: the prefix duospool-state and a NUL byte, the serializer version 4, then eight regions each framed as four
# ASCII tag bytes, a u32 length and the payload, little-endian, in the fixed order PROF CONT POWR TIME RAM8 MPRS CPU0 BUS0 (plan 03-03 and plan 03-16, D-121; PSGN and VDCP left the stream; CPU0 is a x y s p, pc as a u16, speed; BUS0 is io_buffer, mpr_latch and the selection index of the model parameter tma_zero, three bytes, all 0 at boot). Each payload is
# checked against the booted instance, the stream must be consumed exactly, and the SHA-256 of the captured stream must equal ds_digest and the
# literal below. The literal comes from a throwaway perl script outside the repo (Digest::SHA and Math::BigInt) that wrote the stream of the
# written rules for a seed-42 boot of plain-256k: the content sha256 is the host shasum of the emitted recipe, the RAM and registers are the
# splitmix literals of poweron_draw_order, and the CPU0 bytes are the reset state written in the plan 03-01 rules (a x y s 0, p = the I bit,
# speed 0, pc = the reset vector at file bank 0 offsets 8190 and 8191 of the recipe image, BUS0 = three zero bytes). The literal was recomputed for serial version 4 (plan 03-17, BUS0 gained the tma_zero selection byte) by the same kind of throwaway perl script, which first
# rebuilt the version 3 stream and reproduced the committed version 3 digest af54a963... (which in turn had reproduced the version 2 digest eddf37b1...), so every piece of the stream was cross-checked before the third BUS0 byte was appended and the version changed; the version 4 stream file it wrote
# hashes to the literal under shasum -a 256 (8390 bytes). Evidence tier E0: it pins the encoding and shows repeatability, never that the state is right.
id = "digest_stream_prefix"
kind = "digest_stream"
fixture = "plain-256k"
request = "bind.powerup_policy=seeded-prng-v1;seed=42"
expect = "version=4;frames=PROF:32,CONT:40,POWR:16,TIME:8,RAM8:8192,MPRS:8,CPU0:8,BUS0:3;size=262144;enum=1;digest=5065a6c15d2fe21ae9ec662fbc87036dea04752fcfd0475c98928e583271d2c6"
meaning = "The digest stream is the framed, little-endian stream of eight regions behind the prefix and version, its payloads match the instance, and ds_digest is the SHA-256 of exactly that stream and of the independently derived literal"
required = true
control = false
expect_outcome = "pass"
pins = []
