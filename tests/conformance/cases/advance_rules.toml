# Placeholder stepping rules (D-68, D-75): ds_advance adds the cycles to machine time, steps the psg_noise register once per cycle (a fixed
# 32-bit xorshift: x ^= x << 13; x ^= x >> 17; x ^= x << 5) and adds the cycles to vdc_phase, wrapping. The literals were derived
# independently of the C code with a throwaway perl script outside the repo: the seed-42 power-on values of poweron_draw_order advanced by
# 1000 and then 2000 cycles; the register started at 1 gives 0x42021, 0x4080601, 0x9DCCA8C5 (the xorshift32 sequence for seed 1, 270369,
# 67634689, 2647435461); 0xFFFFFFF0 plus 32 wraps to 0x10; one maximum call of 1048576 cycles (the register then has taken 32 + 1048576 steps from 0x9DCCA8C5). A call above the maximum is refused and changes
# nothing; replay=7 requires the same final state when every advance is split into calls of 7 cycles. These are placeholder rules and
# make no hardware claim (LED-PROF-0002). Evidence tier E0.
id = "advance_rules"
kind = "advance"
fixture = "plain-256k"
request = "bind.powerup_policy=seeded-prng-v1;seed=42"
expect = "replay=7;advance=1000;time=1000;psg_noise=0x7E038132;vdc_phase=0xA228C37B;advance=1000;psg_noise=0x196F8C57;vdc_phase=0xA228C763;refuse=1048577;time=2000;set_noise=0x1;advance=1;psg_noise=0x42021;advance=2;psg_noise=0x9DCCA8C5;set_vdc=0xFFFFFFF0;advance=32;vdc_phase=0x10;time=2035;advance=1048576;time=1050611;psg_noise=0x9FC86668;vdc_phase=0x100010"
meaning = "Stepping adds cycles to machine time, steps the placeholder xorshift register once per cycle and the wrapping phase counter, matches the perl-derived literals, refuses a call above 1048576 cycles without a change, and does not depend on how cycles are split"
required = true
control = false
expect_outcome = "pass"
pins = []
