# The vid sink channel of ds_run (plan 04-02; D-162, F-2, T-04-05, T-04-07): the third caller-owned sink, a byte buffer for whole raw-video records. Part attached: the authored ds-proto is run once with no sink (the reference) and once with a vid sink of 4096 bytes
# whose header and buffer are poisoned with $A5 and which has guard bytes around it. No video exists yet (the tracer of plan 04-04 is the first producer), so the header after the run must read count 0, lost 0, seq 0, bytes 0 and the zero word, decoded by hand
# from the bytes, which shows the poisoned header was overwritten and never read; the buffer and its guards must still hold their poison; and the run must give the machine time, steps and digest of the run with no sink.
# Evidence tier E0 (repeatability and non-interference: the core is compared with itself, the header literals are the layout of D-162): a mechanism check, no hardware claim, and the word pass is not a support claim.
id = "vid_chan_append"
kind = "vid_chan_append"
fixture = "authored:ds-proto"
request = ""
expect = "parts=attached"
meaning = "A ds_run request that carries a vid sink is accepted; with no producer the sink header reads count 0, lost 0, seq 0, bytes 0, the poisoned buffer is untouched and the run equals the run without a sink (E0 mechanism, no hardware claim)"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 40000
