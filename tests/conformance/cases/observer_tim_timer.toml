# The observer non-interference matrix on the authored tim-timer (plan 03-23; D-119, CORE-06): the same configurations and modes as observer_ds_proto and observer_cyc_probe (large, drop4, poison, cap0, cap1; whole, chunk:7, stop:5000), run over the fixture whose timer window is written and read throughout, whose interrupt entry
# runs in the same step as the instruction it follows and whose handler stops and acknowledges the timer. Enabling the sinks must not change the verdict RAM, the machine time, the stop sequence or the digest (the digest holds the TIMR, IRQC and IRQS regions), and the logs accumulated over seven chunks must equal the logs of
# the whole run: the timer state changes only inside guest accesses at their own stamps, so a stop between two instructions cannot move it. Evidence tier E0 (repeatability and non-interference: the core is compared with itself): no accuracy, compatibility or hardware claim, and the word pass is not a support claim.
id = "observer_tim_timer"
kind = "observer"
fixture = "authored:tim-timer"
request = ""
expect = "compare=verdict,machine_time,stops,digest"
meaning = "Enabling the instruction sink and the device-register sink in any of five configurations, whole or in 7 chunks or stopped by the callback, changes neither the verdict RAM, the machine time, the stop sequence nor the digest of tim-timer, whose timer interrupt is taken in the same step"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 4000000
sinks = "large,drop4,poison,cap0,cap1"
chunks = "whole,chunk:7,stop:5000"
