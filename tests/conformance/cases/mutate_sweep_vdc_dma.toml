# Mutation sweep of the vdc_dma fixture (plan 04-10; D-126, D-169, D-170, ER-4, ER-5, ER-7, F-41, FIX-03): the built image of fixtures/src/vdc_dma.s (vdc-dma) is loaded once, its DCK1 literal table is found at file offset $1000, and for each of the 23 judged checks the value byte of its entry (the expected literal, or the XOR mask of a GUEST check) is XORed with $FF in a fresh
# in-memory copy that is booted and run in this same process. The unmutated image must pass first. Each mutation must flip exactly its own check to $46 and leave the others $50: a check whose literal can be changed without flipping it is vacuous and the case is guest_failure. The poll count (check 21) is an observe-only row and is excluded from the sweep (F-41: the
# exclusion is the observe file); the other 23 literals are flipped.
# The sweep runs under the default power-on policy only. Evidence tier E0 (a mechanism check of the checks themselves): no accuracy or compatibility claim; the word pass is not a support claim.
id = "mutate_sweep_vdc_dma"
kind = "mutate_sweep"
fixture = "authored:vdc-dma"
request = ""
expect = "id=20;exclude=21"
meaning = "Changing the expected literal of any one of the 23 judged vdc_dma checks flips exactly that check to fail and no other, so none of the 23 judged checks is vacuous; the observe row 21 is excluded"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 2500000
checks = 24
