# Stimulus refusal row (plan 03-22; D-112, T-03-60, F4): the declared IRQ1 and IRQ2 test stimulus is validated by the core when the runner gives it over (ds_irq_stim_set, before the first step), so a bad list is refused with a typed code of src/core/stim_refusals.def and the
# instance is left byte-identical. This row is a list with a level other than 0 or 1 (I5): a level of 2 on an otherwise valid list. The kind is guest with the expect item refused=stim.NAME: the built image of irq_ctl is booted, a valid list is first proven accepted and cleared (a core that refused everything must fail), then the list below must come back as exactly the named
# code, and the guest is never run. The stimulus is a test hook, not evidence about the VDC or any hardware source (ER-5, ASSUMED LED-IRQ-0008). Evidence tier E0. The deferred case irq_stim_refusal_coverage checks that every code of the .def is observed by a row.
id = "irq_stim_refuse_level"
kind = "guest"
fixture = "authored:irq-ctl"
request = ""
expect = "id=11;refused=stim.level"
meaning = "An irq_stim list with a level of 2 (only 0 and 1 exist) is refused as stim.level before the first step, with the instance unchanged; levels 256 and 4294967295 are refused too (the whole word is judged)"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 600
checks = 15
irq_stim = ["1000,1,1", "2000,2,2"]
