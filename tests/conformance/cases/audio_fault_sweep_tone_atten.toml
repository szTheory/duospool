# The fault sweep of the scene tone_atten (plan 05-06; D-209, ER-20, R3): the runner kind audio_fault_sweep runs psg-tone once under the zero policy, applies each fault AF0..AF9 in memory to copies of the captured streams and judges every group of tone_atten of fixtures/src/psg_tone.aexp
# on each copy. Every declared kill must flip its group and a group no declared fault flips fails; the evidence prints the observed kill matrix of all ten faults. E0.
id = "audio_fault_sweep_tone_atten"
