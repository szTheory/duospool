# The PSG register decode (plan 05-03; D-188, D-189; kind psg_decode of psgkinds.c). Rows and classes: $FF written through the bus at offsets r, r + $10 and r + $3F0 stores the same masked value, R0 $07, R1 R2 R5 R8 $FF, R3 $0F, R4 $DF, R6 $1F, R7 $9F at select 4,
# R9 $83 [masks MAN:P8-2+P8-3+P8-4+P8-6+P8-9; mirror ASSUMED:LED-AUD-0004]; reg $A..$F store nothing and return NO_TARGET [MAN:P8-2]; R2..R6 at select 6 and 7 store nothing, NO_TARGET [ASSUMED:LED-AUD-0004]; R7 at select 0..3 dropped, NO_TARGET
# [MAN:P8-2+P8-9 placement; drop ASSUMED:LED-AUD-0004]; R1, R8, R9 ignore R0 [MAN:P8-2+P8-3]; sel_before is R0 before the write and post the stored value [definition, D-196]. Literals written by hand in the kind, never read back from the core. Evidence tier E0.
id = "psg_decode"
kind = "psg_decode"
fixture = "plain-256k"
request = ""
expect = "rows=all"
meaning = "A PSG write decodes reg = offset & $0F at every mirror, stores through the D-189 masks into the selected channel, drops R2..R7 at select 6 and 7, R7 at select 0..3 and reg $A..$F as NO_TARGET, and stores R1, R8 and R9 at any select"
required = true
control = false
expect_outcome = "pass"
pins = ["LED-AUD-0003"]
