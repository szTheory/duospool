# Restore at a sampled stop, tracer (plan 03-30 task 1; CORE-05, D-121, D-122): the authored ds_proto fixture is run to the middle of its run, its snapshot is restored into a FRESH instance booted with another seed (7) and then poisoned (every restorable member 0xA5, and again 0x5A), and the restored
# instance is compared raw, member by member over the hand-written tiling list of ds_core.h, ROM excluded, with the source, then run in lockstep with an uninterrupted reference run (machine time, pc, opcode and a fold of the instruction and device records of every step) and finally to the end of the
# run, where the machine time, the verdict RAM, the digest and every raw member must equal the uninterrupted run. Evidence tier E0: repeatability and consistency; no correctness claim.
id = "snapshot_restore_sampled"
kind = "snapshot_restore"
fixture = "authored:ds-proto"
request = "bind.powerup_policy=seeded-prng-v2;seed=3"
expect = "stops=kth:97;window=32;finish"
meaning = "Snapshots of ds_proto taken at sampled stops restore into a fresh poisoned instance booted with another seed, equal to the source in every member except the ROM, and run in lockstep with the uninterrupted run and to its end"
required = true
control = false
expect_outcome = "pass"
pins = []
until_mclk = 300000
