# A control case of a live-runner mini-root. It is never part of the real inventory: scripts/conformance-run control runs it
# through the real ds_runner and compares the id and outcome fields of its RESULT line with the pair in EXPECT.
id = "spin"
kind = "spin_forever"
fixture = "plain-256k"
request = "bind.powerup_policy=seeded-prng-v1;seed=42"
expect = "never-returns"
meaning = "The case steps the machine forever and prints no RESULT line, so the supervisor that receives TERM must write its cancelled line"
required = true
control = true
expect_outcome = "cancelled"
pins = []
