#
# gate - the CI wrapper over the one local command (record 0006, CI-01, D-61, D-62). The gate logic lives in scripts/check;
# this file only runs it on a clean Linux machine, which is a different machine from the owner's macOS one.
# Block-style YAML only: scripts/workflow-check is a restricted line checker that refuses anything it cannot parse.
#
# The job earns its place by catching four failure classes the owner's machine cannot:
#   1. sh, awk, userland and nm differences from macOS (the Linux image: dash, mawk or gawk, GNU tools, ELF symbols)
#   2. fresh-clone history dependence (a full clone with no local branches or leftover build files; protocol-order and the range audit read history)
#   3. gcc versus clang diagnostics and undefined behaviour (the gate runs one compiler; the two steps after it run each compiler on its own build directory)
#   4. awk dialect drift (the gate runs again under the other awk implementation)
# One job on one runner image, no paths filter and no cache: measure first, and revisit when docs/ci-timings.md shows a step over 30 seconds.
# Timeout: 20 minutes (plan 03-33 review, docs/ci-timings.md). The one real run (Phase 2, 47 stages) took 100 s, but the gate now has 56 stages and
# runs twice (gawk then mawk) plus a gcc and a clang build, and the estimated critical path is 6 to 10 minutes with a wide uncertainty and no CI row
# yet. The limit only bounds a hung job, so it is set to twice the high estimate; tighten it after three recorded Phase 3 rows.
# First-run review items: the apt cc65 step cost, the critical path against this limit, and whether the second awk needs the apt install fallback
# (the Tool versions step prints which awk is the default).
name: gate
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh -eu {0}
jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tool versions
        run: |
          {
            echo "image: ${ImageVersion:-unknown}"
            cmake --version | sed -n 1p
            ninja --version
            gcc --version | sed -n 1p
            clang --version | sed -n 1p
            for t in gawk mawk awk; do command -v "$t" || echo "$t: absent"; done
            readlink -f "$(command -v awk)"
          } >> "$GITHUB_STEP_SUMMARY"
      # The fixture assembler (ca65 and ld65 from cc65) comes from the Ubuntu archive with apt signature checking. The gate's preflight stage
      # fails closed without it. Package identity is not trusted by version string: the encoding-matrix bytes and the manifest hash pins are
      # the identity check (fixtures/lib/TOOLS.md, D-128). No action and no secret is involved (D-60, D-62).
      - name: Gate
        run: sh scripts/check
      - name: Install cc65
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cc65
      # The base commit of the pull request reaches the command through the environment, never through the script text (D-62).
      - name: Range audit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: sh scripts/audit-history --range "${BASE_SHA}..HEAD"
      - name: gcc build and conformance
        run: sh scripts/conformance-run run --preset gate-gcc
      - name: clang build and conformance
        run: sh scripts/conformance-run run --preset gate-clang
      # The other awk implementation goes first on PATH through a symlink in a temporary directory; nothing system-wide is switched.
      # If it is not installed, apt installs it as a fallback (a choice recorded for review after the first run, D-74).
      - name: Second awk gate run
        run: |
          default_awk=$(readlink -f "$(command -v awk)")
          case $default_awk in
            */gawk) other=mawk ;;
            *) other=gawk ;;
          esac
          if ! command -v "$other" > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "$other"
          fi
          shim="$RUNNER_TEMP/awk-shim"
          mkdir -p "$shim"
          ln -sf "$(command -v "$other")" "$shim/awk"
          PATH="$shim:$PATH"
          export PATH
          echo "first run awk: $default_awk"
          echo "second run awk: $(readlink -f "$(command -v awk)")"
          sh scripts/check
