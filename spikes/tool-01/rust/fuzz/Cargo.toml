#
# The cargo-fuzz crate of the Rust skeleton (protocol G5). It has its own [workspace], so libfuzzer-sys never enters the
# product workspace or its Cargo.lock (RESEARCH Pitfall 16, T-01-21). libfuzzer-sys is licensed (MIT OR Apache-2.0) AND NCSA.
[package]
name = "duospool-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
duospool_core = { path = "../core" }

[features]
# Forwards to the core's liveness control; used only by `opt_fuzz60 <s> yes`.
planted-bug = ["duospool_core/planted-bug"]

[[bin]]
name = "loader"
path = "fuzz_targets/loader.rs"
test = false
doc = false
bench = false

[workspace]
