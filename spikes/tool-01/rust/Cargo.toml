#
# Self-contained workspace: a later repository-root workspace cannot absorb this one (RESEARCH Pitfall 16).
[workspace]
resolver = "3"
members = ["core", "capi"]

[workspace.package]
edition = "2024"
version = "0.0.0"
publish = false
license = "MIT OR Apache-2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
