# hucard.cfg - the ld65 linker configuration of the authored plain-HuCard fixtures (D-123). Project-owned: the stock cc65 pce target
# config is not used. ROMBANKS is the image size in 8 KiB banks, given with -D on the ld65 command line (32 gives 256 KiB, 48 gives
# 384 KiB, 128 gives 1 MiB). The image is the file order of the memory areas below.
#   bank 0 (file offset $0000-$1FFF) is mapped at logical $E000 by MPR7 = $00 at reset: code in $E000-$EFFF, the check-literal table
#         in $F000-$FFF5 (segment CHECKLIT, file offset $1000, the literal table written by the CHECK_TABLE and LIT macros of check.inc, plan 03-05) and the five interrupt
#         vectors at $FFF6 (IRQ2 and BRK, IRQ1, TIMER, NMI, RESET), in that order.
#   the extension banks are filled with $FF, or hold the optional segment BANKS (plan 03-16): a fixture that needs known bytes in the banks above bank 0 (mmu_mpr) writes exactly (ROMBANKS - 1) * $2000 bytes into it.
# Zero page and stack of the HuC6280 are logical $2000-$21FF: none of these areas is a machine address, they only lay out the file.
MEMORY {
    ROMA: start = $E000, size = $1000,   fill = yes, fillval = $FF, file = %O;
    ROMB: start = $F000, size = $0FF6,   fill = yes, fillval = $FF, file = %O;
    VEC:  start = $FFF6, size = $000A,   fill = yes, fillval = $FF, file = %O;
    EXT:  start = $0000, size = (ROMBANKS - 1) * $2000, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    CODE:     load = ROMA, type = ro;
    CHECKLIT: load = ROMB, type = ro, optional = yes;
    BANKS:    load = EXT,  type = ro, optional = yes;
    VECTORS:  load = VEC,  type = ro;
}
