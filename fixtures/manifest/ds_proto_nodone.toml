redistribution = "generated-not-committed"
meaning = "DSV1 protocol control: the same source with the switch DSV_NODONE, which never writes the done state. The expected outcome is declared in tests/conformance/cases/ds_proto_nodone.toml from the fault the switch plants, never from DuoSpool output."
