# ER-2 record (plan 04-13, verifier gsd-executor, 2026-11-12). Condition 1: H7-12 (256 words are transferred at the beginning of a vertical blanking period; the transfer is triggered by access to the high byte of DVSSR; if the register is set the transfer starts at the beginning of the following vertical blanking period) was re-read as a page image from a scratch copy of the
# HuC6270 manual (sha256 2bb87866..., never committed).
# Condition 2: the literals are the MAN H7-12 rows of fixtures/src/vdc_satb.s (a DVSSR low-byte write starts nothing; a high-byte write is carried out at the FOLLOWING vertical blanking, not mid-frame; nothing re-armed copies nothing) and the 256 words that the vdc_satb_data kind compares with a pattern the guest wrote; none comes from the core or a hash.
# Condition 3: the statement says equals the manual's stated values. Condition 4: withheld lists hardware accuracy, timing and compatibility. Condition 5: pin TEST:vdc_satb_data names the entry in its pins; the trigger and start rows run in the sibling case vdc_satb, listed in the evidence field.
