# Interrupt controller registers, priority, vectors and acknowledge (D-110; CPU-03). A candidate for supported (E1, documentary) under ER-2 for part (a) only (writer note 3): the statement is split so that only page facts that are image-verified could later promote; part (b) is modelling and stays assumed.
# Part (a), page facts: $1403 request register bit 0 IRQ2, bit 1 IRQ1, bit 2 TIQ, the two inputs read as inverted pin level (1 = requested), TIQ read-only, set by a borrow, reset by a write, 0 at reset (H8-15); $1402 disable register bits IRQ2D, IRQ1D, TIQD, 1 disables, 0 at reset (H8-16).
# Part (a) also: priority timer, IRQ1, IRQ2 and vectors $FFFA, $FFF8, $FFF6 (BRK shares $FFF6), inputs sampled in the last bus cycle, entry pushes PCH, PCL, P with B 0, sets I, resets D (H8-12, H8-13). Part (b), assumed: a write is the only acknowledge and clears TIQ only, the latch is set by every borrow.
# IRQ1 and IRQ2 come only from the declared test stimulus (LED-IRQ-0008); NMI is undriven. Status assumed until plan 03-32 re-reads the pages (ER-1, ER-2, R-8); this entry promotes nothing. The in-guest checks are E2 self-consistency where they count steps.
# Page images read on 2026-11-11 by the plan 03-34 executor from a scratch copy of the hardware manual (sha256 40a32e5d..., never committed): H8-12, H8-13, H8-14, H8-15, H8-16, H8-18, H8-21.
