# Interrupt controller registers, priority and vectors (D-110; CPU-03). Supported (E1, documentary) by plan 03-32 under ER-2 for the page-backed clauses only (writer note 3): the statement is restricted to them and the model clauses moved to the assumption field.
# ER-2 record (plan 03-32, verifier gsd-executor, 2026-11-11). Condition 1: H8-12 (inputs sampled in the last bus cycle, NMI edge), H8-13 (priority RESET, NMI, BRK, TIMER, IRQ1, IRQ2; vectors FFF6 IRQ2 and BRK, FFF8 IRQ1, FFFA timer; IRQ1 and IRQ2 are level sense), H8-14 (TIQ reset by a write cycle to the request register), H8-15 (request register: bit 0 IRQ2, bit 1 IRQ1, bit 2 TIQ,
# IRQ1 and IRQ2 are the inverted pin level, TIQ read only, set by a timer borrow, reset by a write, 0 at reset), H8-16 (disable register bits IRQ2D, IRQ1D, TIQD, 1 disables, all 0 after reset), H8-24 ($1402 and $1403 in the device table), H8-5 (B pushed 0 for IRQ2 and 1 for BRK) and H8-18 were read as page images from a scratch copy of the hardware manual (sha256 40a32e5d..., never committed).
# Condition 2: the MAN-class checks of irq_ctl (2 to 14 and 16 to 29) state those page facts as literals; checks 30 to 33 are ASSUMED or GUEST class and are not counted, and checks 1 and 15 only describe the declared stimulus. Condition 3: equals the manual's stated values. Condition 4: withheld lists the three required items. Condition 5: pin TEST:irq_ctl_pre.
# The sources of IRQ1 and IRQ2 are a declared test stimulus (LED-IRQ-0008, ER-5), so the checks show the controller logic given the stimulus and nothing about the VDC or any real source. The in-guest checks are not used for any timing claim. The pin also names LED-IRQ-0006, which is not claimed here.
