# Opcode byte and base-cycle table (D-97; CPU-01, CPU-06). Supported (E1, documentary) by plan 03-32 under ER-2: a documentary comparison of the compiled table with a page transcription, not a hardware measurement.
# ER-2 record (plan 03-32, verifier gsd-executor, 2026-11-11). Condition 1, image-verified cites: H8-25 was read as a page image (200 dpi render of PDF page 28 of the scratch copy, sha256 40a32e5d..., never committed) and every cell was transcribed again by hand without opening the TSV.
# Condition 2, literals from the page: the expected values are the rows of tests/oracle/huc6280-opcodes.tsv, a page-image transcription made before src/core/cpu_ops.def existed; the new reading agrees with it for 234 defined cells (230 equal in bytes and cycles) and 22 empty cells, and differs only at opcodes 34 to 37 and B5.
# Condition 2 (continued): those cells and B4 are the printing errors of the map. The instruction pages S8-18 (35 AND zp,X 2 bytes 4 cycles), S8-25 (34 BIT zp,X 2/4), S8-68 (36 ROL zp,X 2/6), S8-67 (37 RMB3 2/7), S8-55 (B4 LDY zp,X 2/4) and S8-53 (B5 LDA zp,X 2/4) were read as images and decide them.
# Block transfers: the map cells print 7 bytes and a footnote 17+16z (a misprint of 17+6x); S8-89 (TAI F3), S8-94 (TDD C3), S8-96 (E3, printed as TAI there, TIA in the map), S8-98 (TII 73) and S8-100 (TIN D3) print 7 bytes and 17+6x, and the table holds base 17.
# Condition 3, wording: the statement says the table equals the manual's stated values. Condition 4, withheld: hardware cycle accuracy, interrupt latency and game compatibility are listed. Condition 5, pin: TEST:opcode_table_manual, the case that compares all 256 opcodes. The S8 pages not named above were read by plan 03-08 and not again here; the statement does not rest on them.
