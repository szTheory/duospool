# ST0, ST1 and ST2 (D-106; CPU-02, CORE-06). Supported (E1, documentary) by plan 03-32 under ER-2: the equality of the core with page statements, not a hardware measurement. The cite is H8-8 Table 2-2-3 and S8-80, not H8-3 as the ROADMAP says: H8-3 is the stack and reset page (R-6); the ROADMAP text is not edited.
# ER-2 record (plan 03-32, verifier gsd-executor, 2026-11-11). Condition 1: H8-8 (A20 high in the write cycle of ST0, ST1, ST2; Table 2-2-3: ST0 A1 0 A0 0, ST1 A1 1 A0 0, ST2 A1 1 A0 1), S8-80 S8-81 S8-82 (2 bytes, 4 cycles, CE7 L, (A1,A0) = (0,0), (1,0), (1,1), machine codes 03 13 23), H8-9 (CE7 HuC6270 at physical 1FE000-1FE3FF)
# and H8-24 (VDC at logical 0000, 0002, 0003 for ST0, ST1, ST2) were read as page images from a scratch copy of the hardware manual (sha256 40a32e5d..., never committed) and a scratch copy of the software manual (sha256 51eeda39..., never committed).
# Condition 2: the twelve st= literals of st_bypass are $1FE000, $1FE002 and $1FE003 with the immediates written in the fixture; the addresses are the combination of the Table 2-2-3 codes with the H8-9 chip enable (a derivation of three page facts, named as such in the assumption field), and none comes from cpu_ops.def or from a DuoSpool run.
# Condition 3: the statement says equals the manual's stated values. Condition 4: withheld lists the three required items and the VDC reaction. Condition 5: pin TEST:st_bypass. The penalty of the store is LED-CPU-0017 and is not part of this entry.
id = "LED-CPU-0016"
statement = "DuoSpool's ST0, ST1 and ST2 write their immediate to physical $1FE000, $1FE002 and $1FE003 whatever the mapping registers hold. This equals the manual's stated values: A1,A0 = 00, 10, 11 with CE7 asserted and A13 to A20 high (H8-8 Table 2-2-3, S8-80 to S8-82), the HuC6270 at $1FE000-$1FE3FF (H8-9, H8-24)."
profile = "pce-hucard-2btn"
status = "supported"
sources = ["FACT|H8-8 S8-80 S8-81 S8-82|gsd-executor images 2026-11-11: Table 2-2-3 A1,A0 = 00 10 11, A13 to A20 high; ST0 03 ST1 13 ST2 23, 2 bytes 4 cycles, CE7 L", "FACT|H8-9 H8-24|same read: VDC CE7 at physical 1FE000-1FE3FF, logical 0000 0002 0003 for ST0 ST1 ST2"]
