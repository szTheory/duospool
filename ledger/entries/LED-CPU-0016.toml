disagreement = "The ROADMAP names H8-3 for the ST0-ST2 bypass; that page is the stack and reset page (R-6), so the cite is corrected here and the ROADMAP is not edited. The manual shows the A1,A0 code and not the physical address: the form 0x1FE00n is a combination of three pages. No emulator reading is recorded for the bypass."
pinning_test = "TEST:st_bypass"
