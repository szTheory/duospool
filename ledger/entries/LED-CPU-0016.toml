# ST0, ST1 and ST2 (D-106; CPU-02, CORE-06). A candidate for supported (E1, documentary) under ER-2, but the status stays assumed until plan 03-32 re-reads the pages behind it and checks every condition of ER-2; this entry promotes nothing.
# The cite is H8-8 Table 2-2-3 and S8-80, not H8-3 as the ROADMAP says: H8-3 is the stack and reset page (research errata R-6). The ROADMAP text is not edited.
# Page images read by the plan 03-20 executor on 2026-11-11: H8-8 (A20 high in the write cycle of ST0, ST1, ST2 to the HuC6270, a special code on A0 and A1; Table 2-2-3: ST0 A1 0 A0 0, ST1 A1 1 A0 0, ST2 A1 1 A0 1), S8-80 (ST0 03 nn, 2 bytes, 4 cycles, CE7 L, A1 L, A0 L), H8-24 and H8-9 (the VDC at physical 1FE000).
# The statement follows the manual's wording (research mismatch 1); the physical addresses combine Table 2-2-3 with H8-9 and H8-24. The kind st_bypass compares the device-register log of twelve stores under four settings of MPR0 with the addresses and immediates written in the case.
