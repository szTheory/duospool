# BG scroll latch (D-156; VID-01). Supported (E1, documentary) by plan 04-13 under ER-2, scoped to the next-line statements of the page: the equality of the core with page statements, not a hardware measurement. The first display line that shows a BYR write, the counter rows and the position inside the line are modelling readings outside the E1 part (finding F-12).
# ER-2 record (plan 04-13, verifier gsd-executor, 2026-11-12). Condition 1: H7-7 (BXR: if the register is updated the screen becomes valid with the next scanning line; BYR: if the register is updated during display the screen becomes valid with the next scanning line, BYR + 1) was re-read as a page image from a scratch copy of the HuC6270 manual (sha256 2bb87866..., never committed).
# Condition 2: the literals are the MAN H7-7 rows of fixtures/src/bg_scroll.vexp (the latch group for BXR and the byr_next group for BYR), derived by hand on solid tiles whose rows do not depend on scroll direction or wrap, and judged on a line located by the dev-log stamp of the write, at least 250 master clocks from every line origin; none comes from the core or a hash.
# Condition 3: the statement says equals the manual's stated values. Condition 4: withheld lists hardware accuracy, timing and compatibility. Condition 5: pin TEST:video_bg_scroll names the entry in its pins.
