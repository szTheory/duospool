# PSG counter timing (05-CONTEXT D-185; AUD-01). Modelling assumptions: the manual is silent on reload timing, tick phase and tie order.
# Constant (plan 05-03, this ledger id): psg_tick_phase_mclk 0.
id = "LED-AUD-0012"
statement = "DuoSpool models PSG counter timing as: ticks at k x d master clocks (psg_tick_phase_mclk 0); R2, R3 and R7 writes apply at the next reload; a counter is frozen while chON 0 or DDA 1 (select 1 also while TRG 1); the select 4 and 5 wave counters run under NE 1; volume writes act at their stamp; ties: select 1, select 0 to 5, noise, sample, then a write. Modelling assumption."
profile = "pce-hucard-2btn"
status = "assumed"
sources = ["UNKNOWN|the manual|no page gives the reload timing, the tick phase, the freeze rules or the tie order", "CODE|Mednafen, Mesen2, MAME, Geargrafx|reading material only, nothing copied: reload, key-on and NE behaviour as in the disagreement field"]
