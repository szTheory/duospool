# Block transfer cost, length and register restore (D-100; CPU-05, CPU-01). Status stays assumed after the plan 03-32 review: the entry was one of the eight ER-2 candidates and one condition cannot be shown (see below); nothing is promoted here.
# Plan 03-32 re-read as page images (gsd-executor, 2026-11-11, scratch copies of the manuals, sha256 40a32e5d... and 51eeda39..., never committed): H8-6 (length 0 is 65536; six bus cycles per byte; (17 + 6x) cycles; A, X, Y saved on the stack and returned; three stack bytes), S8-88 (flowchart: Y, A, X saved, length 0 is 65,536),
# S8-89 (TAI F3, 7 bytes, 17+6x), S8-94 (TDD C3), S8-96 (E3, printed as TAI there), S8-98 (TII 73) and S8-100 (TIN D3), each 7 bytes and 17+6x. The cost is cited from these pages and never from the H8-25 footnote, which prints 17+16z (a misprint of 17+6x, errata R-1; the scan itself prints it, so it is not an OCR error).
# ER-2 review: the pages are image-verified, the literals are page numbers, the wording is an equality with the manual, withheld is complete and the pin is a real test. What fails is the evidence for the cost clause, the headline of the entry: the cost is shown only through the timer counter (cpu_blk_len0 check 41, cpu_blk checks 36 to 38),
# and those checks use the community-reported CPU cycle length (LED-CPU-0003), so they are E2 self-consistency and cannot support a promotion (ER-3). The clauses that are E1-capable, length 0 = 65536 and A, X, Y and S given back, are MAN:H8-6 checks (cpu_blk 30, 31, 39, 40, 42), but ledger ids are final (03-CONTEXT section K) and the entry is not split.
# What would promote it: a trace-based count of a block transfer, measured like the items of cycle_adders_manual and compared with 17 + 6x for a length of x. The pin is the len0 image of fixtures/src/cpu_blk.s (checks 39 to 42); the model of the transfer (aliasing, the 14 and 3 cycle split, the access offsets) is LED-CPU-0008, the interrupt rule is LED-IRQ-0007.
