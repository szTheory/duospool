# HuCard window and the unmapped boundary (D-44). A modelling assumption, not an established hardware fact.
id = "LED-LOAD-0005"
statement = "DuoSpool models the HuCard window as banks $00-$7F, and banks 0x80 and above are not ROM: the mapper reports such a bank as unmapped and specifies no value for a read of it."
profile = "pce-hucard-2btn"
status = "assumed"
sources = ["REPORT|PCEdev wiki|banks $00-$7F are the HuCard window on the community wiki", "UNKNOWN|pcetech.txt|primary source unreachable during research, not read"]
