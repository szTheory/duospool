# Vertical cycle and active window (D-139, D-140; VID-04, VID-05). A modelling assumption, not a hardware fact. The frame length is the profile field lines_per_frame, so the H7-13 height sum is recorded and not followed.
id = "LED-VID-0005"
statement = "R1: the vertical cycle runs VDS+2, VDW+1, VCR, VSW+1 lines in that order, restarted at each frame start and repeated; a character is 8 dots; the active window starts (HDS+1)*8 dots into the line, is (HDW+1)*8 dots wide and is clipped at the line end; no fixed width exists. A modelling assumption."
