# The IRQ1 and IRQ2 test stimulus (D-112; CPU-03, ER-5). A TEST HOOK: IRQ1 and IRQ2 have no hardware source in the machine until the VDC exists in Phase 4, so a case declares their levels with the key irq_stim and the core copies the list in before the first step. It is not evidence about the VDC or any real source.
# Events are AT,LINE,LEVEL (master clocks, line 1 or 2, level 1 requested or 0 not), at most 16, times non-decreasing, validated by the core with typed stim.* refusals, evaluated as a pure function of time and printed in the [stimulus] table of the run record. With none declared both lines read 0. NMI has no driver.
# Checks 1 and 15 of irq_ctl name this entry. Phase 4 replaces the stimulus for IRQ1 and it stays for IRQ2. Page images read on 2026-11-11 by the plan 03-34 executor from a scratch copy of the hardware manual (sha256 40a32e5d..., never committed): H8-12, H8-13, H8-15.
