# VCE window and colour table (D-152; VID-05). Supported (E1, documentary) by plan 04-13 under ER-2, scoped to the H6-2 to H6-5 facts: the equality of the core with page statements, not a hardware measurement. Unlisted reads, the unused data bits, the address wrap, the window mirrors and the block-transfer behaviour are modelling readings outside the E1 part.
# ER-2 record (plan 04-13, verifier gsd-executor, 2026-11-12). Condition 1: H6-2 (CR, CTA, CTW and CTR by the pins A1 and A2, AO selects the low or high byte; CTA 9 bits; G, R and B of 3 bits over data bits 8-0), H6-3 (CTA is incremented automatically after the high byte of the data is transferred) and H6-5 (write: CTA low, CTA high, data low, data high; read: the address in
# two steps, the data low byte first; 512 addresses)
# were re-read as page images from a scratch copy of the HuC6260 manual (sha256 c6f0d83a..., never committed). Condition 2: the literals are the MAN rows of fixtures/src/vce_pal.s (entry 0 and entry $100 read back, the address stepping once after the high byte only) and the GUEST row pal_bijection over all 512 entries; none comes from the core or a hash.
# Condition 3: the statement says equals the manual's stated values. Condition 4: withheld lists hardware accuracy, timing and compatibility. Condition 5: pin TEST:vce_pal names the entry in its pins.
id = "LED-VID-0016"
