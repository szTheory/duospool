id = "LED-PROF-0002"
statement = "DuoSpool models power-on as one of three policies bound in the run request: zero (RAM zero), seeded-prng-v1 (splitmix64, one stream per domain, RAM only) or seeded-prng-v2 (v1 plus the cpu, mpr and tmr domains, LED-PROF-0003). SUPERSEDED: the unit clause (psg_noise, vdc_phase, placeholder cycles) by D-91 and the all-zero mapping register clause by D-114. A modelling choice."
