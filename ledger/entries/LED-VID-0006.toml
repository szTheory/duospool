id = "LED-VID-0006"
statement = "VL0 (E1 documentary): DuoSpool's VDC register interface equals the manual's stated values: AR keeps bits 4-0 (H7-3); a high-byte write of VWR writes the word and MAWR steps by the IW increment +1, +$20, +$40 or +$80 (H7-5, H7-7); a high-byte write of MARR starts a read, a high-byte read of VRR triggers the next word and MARR steps likewise; the status high byte reads 00h (H7-25)."
