# PSG LFO (05-CONTEXT D-192 as amended by D-219 and D-231; AUD-01). ER-14 hold on the statement (it gives an LFO rate); the status stays assumed until the owner settles the PSG clock.
# Phase 5 review fix WR-06 (2026-11-14) cut the statement to the register side while the LFO was in Phase 5.1 (D-234); plan 05.1-01 (2026-11-14) returned the planned modulation clauses to the statement with the coupled fold (05.1-CONTEXT C-10).
# Pin move (plan 05.1-03, 2026-11-14; 05.1-CONTEXT C-07): the pin is now TEST:audio_lfo_static, the guest case whose MAN groups lfo2 and lfo3 judge held modulation at CTL 2 and 3 and which names this entry in its pins; psg_lfo_trg keeps the C-level rows and no longer pins. The pin move changes no claim and no status.
# ER-14 hold kept (the statement gives an LFO rate): the entry stays assumed. C-level-only clause recorded by the 05.1-02 scratch mutant re-run: the TRG freeze of the select-1 counter (mutant W30, psg_rem[1] = 0 deleted) is killed by psg_fold and psg_lfo_trg and survives every psg_lfo guest case, because no psg_lfo scene has select 1 running and audible at a TRG 1 write.
# The R9 write with TRG 1 sets widx[1] to 0; later R6 writes may advance it, which is legal and restorable (D-231); the held value is wave[1][0] - 16 whatever widx[1] is (P8-6: the data of address 0).
# Phase 5.1 review fix WR-01 (2026-11-14): the coupled select-1 step d x F1e x FLFe is conditioned on the LFO applying (psg.c chan_period: LF CTL != 0, select 0 and 1 with chON 1) and TRG 0. With CTL 0 or a select off, select 1 steps every d x F1e: the rel group of lfo_release (1,536 clocks) and psg_lfo_trg (768 clocks) rely on it.
# The 400-character line cap took the "(masked $83)" of the stored clause out of the statement: LED-AUD-0003 states the stored masks R0 $07, R3 $0F, R4 $DF, R6 $1F, R7 $9F, R9 $83, others $FF. The model is unchanged, only the wording.
id = "LED-AUD-0011"
statement = "DuoSpool models the LFO: R8 and R9 are stored; while LF CTL != 0 and select 0 and 1 have chON 1, select 0 reloads with (F0 + $1000 + (w << s) - (16 << s)) & $FFF, s = 2 x (CTL - 1), w = wave[1][widx[1]], and select 1 with TRG 0 steps every d x F1e x FLFe instead of d x F1e; TRG 1 sets widx[1] to 0, freezes select 1 and holds w at wave[1][0] whatever widx[1] is. Modelling assumption."
profile = "pce-hucard-2btn"
status = "assumed"
sources = ["FACT|P8-6|images 2026-11-13: R8 with ch2 R2 R3 one counter; TRG 1 resets, halts with address-0 data, resets the counter; ch1 and ch2 enabled", "FACT|P8-7 P8-8 P8-9|same read: value - $10; CTL shifts 0, 2, 4; fLFO = fmaster/(2 x 32 x F2 x FLF), 20-bit counter", "CODE|Mednafen, Mesen2|reading material only, nothing copied: counter held while TRG 1"]
evidence = []
disagreement = "DX-4 LFO arithmetic: P8-8 draws 4 added bits while P8-7 maps the 5-bit word to w - 16; the extension width is a reading, and the read instant and the TRG restart instant have no page. DX-16 TRG level versus pulse: the page says modulation is halted until 0 is written; Mednafen and Mesen2 hold the counter while TRG is 1."
pinning_test = "TEST:audio_lfo_static"
updated = "2026-11-14"
assumption = "Held by ER-14 (the statement gives an LFO rate). Project choices: the TRG 1 -> 0 restart of select 1 at (w - w mod d) + d x F1e, or + d x F1e x FLFe when coupled (psg_trg_release_restart, LED-AUD-0004); the read instant after a select-1 step at the same instant; enabled read as chON 1; a coupling change applies at the next reload. Clauses returned with 05.1-01."
revisit_phase = 5
