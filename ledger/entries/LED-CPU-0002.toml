id = "LED-CPU-0002"
statement = "The DuoSpool cycle adders equal the manual's stated values: a taken conditional branch, BBR and BBS add 2 cycles, T mode adds 3 to ADC, AND, EOR and ORA, decimal mode adds 1 to ADC and SBC, and BRK, RTI, TAM, TMA, CSL and CSH take 8, 7, 5, 4, 3 and 3 cycles at the current speed."
profile = "pce-hucard-2btn"
status = "assumed"
sources = ["FACT|S8-17 S8-74|T=1 adds 3 cycles, D=1 adds 1, V unaffected; images read by gsd-phase-researcher 2026-11-10", "FACT|S8-20 S8-24 S8-30 S8-70 S8-90 S8-101|BBR 6 +2 taken, BEQ 2 +2, BRK 8, RTI 7, TAM 5, TMA 4; gsd-phase-researcher 2026-11-10, gsd-executor 2026-11-11", "FACT|H8-4 H8-25|decimal +1 cycle; CSL CSH map cells 3 cycles, no S8 page (R-6); gsd-phase-researcher 2026-11-10"]
evidence = ["E1|tests/conformance/cases/cycle_adders_manual.toml: 18 counts measured from the cyc_probe trace equal page literals; listed here, counted only after the plan 03-32 re-read (ER-1, R-8)", "E0|tests/conformance/cases/cycle_adders_manual.toml: the measured quantity is the core own charged time, not an in-guest clock"]
disagreement = "H8-25 footnote prints the block-transfer cost as 17+16z, a misprint of 17+6x (H8-6, S8-88 and S8-89 print 17+6x; R-1): kept here for later block use. H8-4 prose says C is set on a borrow while S8-74 gives A - M - not C: the formula page decides, no cycle is involved."
