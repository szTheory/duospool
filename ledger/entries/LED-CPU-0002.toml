# Cycle adders (D-98; CPU-01, CPU-06). Supported (E1, documentary) by plan 03-32 under ER-2: the cycle counts of the compiled core equal page literals, a documentary comparison, not a hardware measurement.
# ER-2 record (plan 03-32, verifier gsd-executor, 2026-11-11). Condition 1: S8-17 (ADC imm 2 cycles; T=1 adds 3; D=1 adds 1, V unaffected), S8-74 (SBC, D=1 adds 1), S8-20 (BBRi 3 bytes 6 cycles, 2 more when taken), S8-24 (BEQ 2, 2 more when taken), S8-30 (BRK 8), S8-70 (RTI 7), S8-90 (TAMi 5), S8-101 (TMAi 4),
# S8-76 (SED 2), S8-78 (SET 2), S8-49 (INX 2), H8-4 (D=1 adds one cycle for ADC and SBC) and H8-25 (CSL 54 and CSH D4, 1 byte 3 cycles) were all read as page images from a scratch copy of the software manual (sha256 51eeda39..., never committed) and a scratch copy of the hardware manual (sha256 40a32e5d..., never committed).
# Condition 2: every CYCLES literal of cycle_adders_manual is a number printed on one of those pages, written by the case author; none comes from src/core/cpu_ops.def or from a DuoSpool run (checked against the 18 items on 2026-11-11). Condition 3: the statement says equals the manual's stated values. Condition 4: withheld lists the three required items. Condition 5: pin TEST:cycle_adders_manual.
# The statement names only what the pinned case measures. T mode on AND, EOR and ORA, BBS and the other relative branches have their adders in the compiled table and are not asserted by the case, so they are not claimed here; the block-transfer cost is LED-CPU-0007. The 12 and 3 master clocks per cycle are LED-CPU-0003 and cancel out of a count in cycles.
id = "LED-CPU-0002"
statement = "The DuoSpool cycle counts equal the manual's stated values: a taken BEQ or BBRi adds 2 cycles (S8-24, S8-20), T mode adds 3 to ADC (S8-17), decimal mode adds 1 to ADC and SBC (S8-17, S8-74, H8-4), and BRK, RTI, TAMi, TMAi, CSL and CSH take 8, 7, 5, 4, 3 and 3 cycles (S8-30, S8-70, S8-90, S8-101, H8-25)."
profile = "pce-hucard-2btn"
status = "supported"
sources = ["FACT|S8-17 S8-74 H8-4|gsd-executor images 2026-11-11: ADC T=1 adds 3, D=1 adds 1 (SBC too), V unaffected", "FACT|S8-20 S8-24 S8-30 S8-70 S8-90 S8-101|same read: BBRi 6 +2, BEQ 2 +2, BRK 8, RTI 7, TAMi 5, TMAi 4", "FACT|H8-25|same read: CSL (54) and CSH (D4) 1 byte 3 cycles; no S8 page (R-6)"]
evidence = ["E1|tests/conformance/cases/cycle_adders_manual.toml: 18 charged counts from the cyc_probe trace equal page literals; pages re-read as images in plan 03-32 (ER-1, R-8)", "E0|tests/conformance/cases/cycle_adders_manual.toml: the measured quantity is the core's own charged time, not an in-guest clock"]
disagreement = "H8-25 footnote prints the block-transfer cost as 17+16z, a misprint of 17+6x (H8-6, S8-88 and S8-89 print 17+6x; R-1): kept for LED-CPU-0007. H8-4 prose says C is set on a borrow while S8-74 gives A - M - not C: the formula page decides, no cycle is involved."
pinning_test = "TEST:cycle_adders_manual"
updated = "2026-11-11"
assumption = "Not claimed: T mode on AND, EOR and ORA, BBS and the other relative branches (adders in the compiled table, not asserted by the case), T mode together with decimal mode (+4), the page-cross penalty of a taken branch (LED-CPU-0010) and the VDC penalty (LED-CPU-0017)."
revisit_phase = 3
withheld = ["any claim of hardware cycle accuracy", "any claim of interrupt latency in cycles", "any claim of game compatibility", "any TG-16 or region claim", "any claim about the cost of T mode combined with decimal mode"]
origin = "03-CONTEXT D-98"
