# CSL and CSH length and cycles, and the power-up speed (D-101; CPU-04). Supported (E1, documentary) by plan 03-32 under ER-2: the equality of the core with two page statements, not a hardware measurement and not a statement about switching.
# ER-2 record (plan 03-32, verifier gsd-executor, 2026-11-11). Condition 1: H8-25 (map cells CSL 54 and CSH D4, 1 byte, 3 cycles each; no software manual page, R-6) and H8-18 (system reset: low speed mode is set; also I set, D reset, MPR7 $00, timer stopped) were read as page images from a scratch copy of the hardware manual (sha256 40a32e5d..., never committed).
# Condition 2: the literals of spd_speed_trace are the 3 cycles of the H8-25 cells and the low speed of the first instruction after reset (H8-18), written in the case; the 1 byte shows in the listing addresses (CSH at $E100, the next instruction at $E101). None comes from cpu_ops.def or from a DuoSpool run. Condition 3: the statement says equals what the manual shows.
# Condition 4: withheld lists the three required items and the switch. Condition 5: pin TEST:spd_speed_trace. The same case also asserts the switching rule of LED-CPU-0006 (the new speed from the next instruction, no extra cost); that rule is not claimed here and stays open there. Everything about switching (which speed the three cycles are charged at, no extra cost) is LED-CPU-0006.
# cycle_adders_manual items 15 to 18 assert the same three cycles (that case pins LED-CPU-0002); spd_speed checks 1 and 13 are E2 self-consistency and do not count here.
