# CSL and CSH length and cycles, and the power-up speed (D-101; CPU-04). A candidate for supported (E1, documentary) under ER-2, but the status stays assumed until plan 03-32 re-reads the pages and checks every condition (ER-1, ER-2, R-8); this entry promotes nothing.
# Only what the manual shows is in the statement: the H8-25 instruction map cells of CSL (opcode 54) and CSH (D4), 1 byte and 3 cycles each, and the reset list of H8-18 (low speed mode is set). The software manual has no page for CSL or CSH (R-6, research mismatch 4). Everything about switching (which speed the three cycles are charged at, no extra cost) is LED-CPU-0006.
# One pin per entry (F9): spd_speed_trace, which compares the core's charged time and speed byte in the instruction trace with these page literals and shows the first instruction at the low speed. cycle_adders_manual items 15 to 18 assert the same three cycles (that case pins LED-CPU-0002); spd_speed checks 1 and 13 are E2 self-consistency.
